name: C8 one-use uv lock refresh

on:
  push:
    branches:
      - agent/issue-52-reproducible-wheel

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-52-reproducible-wheel
          fetch-depth: 0

      - name: Install repository uv version
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.3

      - name: Refresh lock and fail closed on unrelated changes
        run: |
          set -euo pipefail
          uv lock
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "uv.lock" ]; then
            printf 'Unexpected resolver diff:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi
          uv lock --check

      - name: Commit resolver-owned lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'build: reconcile lock after build-system narrowing'
          git push origin HEAD:agent/issue-52-reproducible-wheel
