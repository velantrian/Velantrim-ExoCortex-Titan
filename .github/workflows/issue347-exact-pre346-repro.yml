name: Issue 347 exact pre-346 repro

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue347-exact-pre346-repro.yml"
      - "tests/test_promotion_projection_outbox_caller.py"
      - "core/memory.py"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/sync-python-deps
        with:
          extras: server dev parsers retrieval embeddings graph-lab
      - name: Recreate exact pre-346 harness in runner workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_promotion_projection_outbox_caller.py")
          text = path.read_text()
          block = '''    # Issue #249 is a CAS-contention test, not a concurrent schema-bootstrap
              # test. Every independent store owns a per-instance lazy DDL guard, so
              # entering {PROMOTION_CALL} concurrently on never-opened stores
              # mixes first-use schema churn into the intended CAS race. Initialize
              # each contender sequentially before installing/releasing the CAS gate;
              # the threaded section below then races only the real promotion path.
              for store in stores:
                  store.ensure_schema()
          '''.replace("              ", "").replace("{PROMOTION_CALL}", "validate_and_" + "promote()")
          if block not in text:
              raise SystemExit("preinitialization block not found; refusing approximate replay")
          text = text.replace(block, "", 1)
          if "import traceback\n" not in text:
              text = text.replace("import time\n", "import time\nimport traceback\n", 1)
          old = 'harness.mark_failed_before_gate(contender_id, f"{type(exc).__name__}: {exc}")'
          new = 'harness.mark_failed_before_gate(contender_id, f"{type(exc).__name__}: {exc}\\n{traceback.format_exc()}")'
          if old not in text:
              raise SystemExit("pre-gate diagnostic hook not found; refusing approximate replay")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Repeat exact pre-346 [25] race
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node='tests/test_promotion_projection_outbox_caller.py::test_cas_contention_yields_exactly_one_winner_and_one_intent[25]'
          log="artifacts/pre346-py${{ matrix.python }}.log"
          passed=0
          failed=0
          first_failure=""
          for iteration in $(seq 1 100); do
            set +e
            output=$(python -m pytest -q "$node" --tb=short --timeout=180 2>&1)
            rc=$?
            set -e
            printf '=== iteration %s ===\n%s\n' "$iteration" "$output" >> "$log"
            if [ "$rc" -eq 0 ]; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              if [ -z "$first_failure" ]; then
                first_failure="$iteration"
              fi
            fi
          done
          {
            echo "python=${{ matrix.python }}"
            echo "passes=${passed}"
            echo "failures=${failed}"
            echo "first_failure=${first_failure:-none}"
          } | tee artifacts/summary-py${{ matrix.python }}.txt
          # Characterization outcome: a reproduced failure and a clean run are both evidence.
          exit 0
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue347-pre346-py${{ matrix.python }}
          path: artifacts/
          retention-days: 14
