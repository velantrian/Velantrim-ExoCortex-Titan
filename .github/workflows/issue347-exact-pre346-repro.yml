name: Issue 347 materialize bootstrap fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/issue347-exact-pre346-repro.yml"
      - "core/memory.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: ./.github/actions/sync-python-deps
        with:
          extras: server dev parsers retrieval embeddings graph-lab
      - name: Apply rollback-safe serialized bootstrap fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("core/memory.py")
          text = path.read_text()
          marker = "Issue #347: serialize this lazy DDL region across SQLite connections."
          if marker in text:
              Path(".issue347_already_patched").write_text("1")
              raise SystemExit(0)
          lines = text.splitlines(keepends=True)
          boundary = "            if self.db_path not in self._ddl_initialized_paths:\n"
          end_line = "                self._ddl_initialized_paths.add(self.db_path)\n"
          try:
              start = lines.index(boundary)
              end = lines.index(end_line, start + 1)
          except ValueError as exc:
              raise SystemExit("lazy bootstrap boundaries not found; refusing approximate patch") from exc
          body = lines[start + 1 : end + 1]
          replacement = [
              boundary,
              '                # Issue #347: serialize this lazy DDL region across SQLite connections.\n',
              '                conn.execute("BEGIN IMMEDIATE")\n',
              '                try:\n',
          ]
          replacement.extend("    " + line for line in body)
          replacement.extend([
              '                except Exception:\n',
              '                    try:\n',
              '                        conn.rollback()\n',
              '                    except sqlite3.Error:\n',
              '                        logger.warning("SQLite bootstrap rollback failed", exc_info=True)\n',
              '                    try:\n',
              '                        conn.close()\n',
              '                    except sqlite3.Error:\n',
              '                        logger.warning("SQLite bootstrap close failed", exc_info=True)\n',
              '                    self._sqlite_conn = None\n',
              '                    raise\n',
          ])
          lines[start : end + 1] = replacement
          path.write_text("".join(lines))
          PY
      - name: Prove bootstrap failure releases writer lock
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from core.memory import SQLiteGraphStore
          with tempfile.TemporaryDirectory() as tmp:
              db = Path(tmp) / "bootstrap-failure.db"
              with sqlite3.connect(str(db)) as conn:
                  conn.execute("CREATE VIEW facts AS SELECT 1 AS incompatible")
                  conn.commit()
              store = SQLiteGraphStore(str(db))
              try:
                  try:
                      store.ensure_schema()
                  except sqlite3.OperationalError:
                      pass
                  else:
                      raise AssertionError("malformed schema unexpectedly initialized")
                  assert store._sqlite_conn is None
                  with sqlite3.connect(str(db), timeout=1.0) as probe:
                      probe.execute("BEGIN IMMEDIATE")
                      probe.rollback()
              finally:
                  store.close()
          PY
      - name: Compile production module
        run: python -m py_compile core/memory.py
      - name: Commit validated production fix
        if: hashFiles('.issue347_already_patched') == ''
        run: |
          git config user.name "Velantrim CI"
          git config user.email "actions@users.noreply.github.com"
          git add core/memory.py
          git commit -m "fix(storage): serialize fresh-store lazy bootstrap (#347)"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
