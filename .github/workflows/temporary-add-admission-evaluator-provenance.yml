name: Temporary add admission evaluator provenance

on:
  push:
    branches: [feat/continuity-source-admission-decisions]

permissions:
  contents: write

concurrency:
  group: temporary-admission-evaluator-provenance
  cancel-in-progress: false

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-source-admission-decisions
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"

      - name: Apply structural evaluator-provenance hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def find_line(lines: list[str], target: str, start: int = 0, end: int | None = None) -> int:
              limit = len(lines) if end is None else end
              for index in range(start, limit):
                  if lines[index] == target:
                      return index
              raise SystemExit(f"line not found: {target!r}")

          production = Path("core/continuity/source_admission_decisions.py")
          lines = production.read_text().splitlines()
          class_start = find_line(lines, "class ContinuityObservationAdmissionReceipt:")
          class_end = find_line(lines, "class ContinuityDraftObservationLink:", class_start + 1)

          adapter_field = find_line(lines, "    adapter_version: str", class_start, class_end)
          if "    admission_evaluator_id: str" not in lines[class_start:class_end]:
              lines[adapter_field + 1:adapter_field + 1] = [
                  "    admission_evaluator_id: str",
                  "    admission_evaluator_version: str",
                  "    admission_rule_id: str",
                  "    evaluation_evidence_refs: tuple[str, ...]",
              ]
              class_end += 4

          adapter_normalization = find_line(
              lines,
              '            self, "adapter_version", _text(self.adapter_version, "adapter_version")',
              class_start,
              class_end,
          )
          close_index = find_line(lines, "        )", adapter_normalization + 1, class_end)
          if not any(
              "admission_evaluator_id" in line
              for line in lines[close_index + 1:close_index + 25]
          ):
              block = [
                  "        for field_name in (",
                  '            "admission_evaluator_id",',
                  '            "admission_evaluator_version",',
                  '            "admission_rule_id",',
                  "        ):",
                  "            object.__setattr__(",
                  "                self,",
                  "                field_name,",
                  "                _text(getattr(self, field_name), field_name),",
                  "            )",
                  "        object.__setattr__(",
                  "            self,",
                  '            "evaluation_evidence_refs",',
                  "            _refs(",
                  "                self.evaluation_evidence_refs,",
                  '                "evaluation_evidence_refs",',
                  "                required=True,",
                  "            ),",
                  "        )",
              ]
              lines[close_index + 1:close_index + 1] = block
              class_end += len(block)

          signature_anchor = find_line(
              lines,
              "        rejected_drafts: Iterable[ContinuityDraftRejection],",
              class_start,
              class_end,
          )
          if "        admission_evaluator_id: str," not in lines[signature_anchor:signature_anchor + 10]:
              fields = [
                  "        admission_evaluator_id: str,",
                  "        admission_evaluator_version: str,",
                  "        admission_rule_id: str,",
                  "        evaluation_evidence_refs: Iterable[str],",
              ]
              lines[signature_anchor + 1:signature_anchor + 1] = fields
              class_end += len(fields)

          evaluated_anchor = find_line(
              lines,
              '        evaluated = _aware(evaluated_at, "evaluated_at")',
              class_start,
              class_end,
          )
          if not any(
              "evaluator_id = _text(" in line
              for line in lines[max(class_start, evaluated_anchor - 30):evaluated_anchor]
          ):
              normalization = [
                  "        evaluator_id = _text(",
                  "            admission_evaluator_id,",
                  '            "admission_evaluator_id",',
                  "        )",
                  "        evaluator_version = _text(",
                  "            admission_evaluator_version,",
                  '            "admission_evaluator_version",',
                  "        )",
                  '        rule_id = _text(admission_rule_id, "admission_rule_id")',
                  "        evaluation_evidence = _refs(",
                  "            evaluation_evidence_refs,",
                  '            "evaluation_evidence_refs",',
                  "            required=True,",
                  "        )",
              ]
              lines[evaluated_anchor:evaluated_anchor] = normalization
              class_end += len(normalization)

          payload_anchor = find_line(
              lines,
              '            "adapter_version": source_envelope.producer_adapter_version,',
              class_start,
              class_end,
          )
          if not any(
              '"admission_evaluator_id"' in line
              for line in lines[payload_anchor + 1:payload_anchor + 10]
          ):
              payload_fields = [
                  '            "admission_evaluator_id": evaluator_id,',
                  '            "admission_evaluator_version": evaluator_version,',
                  '            "admission_rule_id": rule_id,',
                  '            "evaluation_evidence_refs": list(evaluation_evidence),',
              ]
              lines[payload_anchor + 1:payload_anchor + 1] = payload_fields
              class_end += len(payload_fields)

          constructor_anchor = find_line(
              lines,
              "            adapter_version=source_envelope.producer_adapter_version,",
              class_start,
              class_end,
          )
          if not any(
              "admission_evaluator_id=" in line
              for line in lines[constructor_anchor + 1:constructor_anchor + 10]
          ):
              constructor_fields = [
                  "            admission_evaluator_id=evaluator_id,",
                  "            admission_evaluator_version=evaluator_version,",
                  "            admission_rule_id=rule_id,",
                  "            evaluation_evidence_refs=evaluation_evidence,",
              ]
              lines[constructor_anchor + 1:constructor_anchor + 1] = constructor_fields
              class_end += len(constructor_fields)

          identity_anchor = find_line(
              lines,
              '            "adapter_version": self.adapter_version,',
              class_start,
              class_end,
          )
          if not any(
              '"admission_evaluator_id"' in line
              for line in lines[identity_anchor + 1:identity_anchor + 10]
          ):
              identity_fields = [
                  '            "admission_evaluator_id": self.admission_evaluator_id,',
                  '            "admission_evaluator_version": self.admission_evaluator_version,',
                  '            "admission_rule_id": self.admission_rule_id,',
                  '            "evaluation_evidence_refs": list(self.evaluation_evidence_refs),',
              ]
              lines[identity_anchor + 1:identity_anchor + 1] = identity_fields

          production.write_text("\n".join(lines) + "\n")

          tests = Path("tests/test_continuity_source_admission_decisions.py")
          test_lines = tests.read_text().splitlines()
          helper_start = find_line(test_lines, "def _receipt(")
          helper_end = find_line(test_lines, "def _batch(", helper_start + 1)
          rejected_anchor = find_line(
              test_lines,
              '        "rejected_drafts": rejected,',
              helper_start,
              helper_end,
          )
          if not any(
              '"admission_evaluator_id"' in line
              for line in test_lines[rejected_anchor + 1:rejected_anchor + 10]
          ):
              defaults = [
                  '        "admission_evaluator_id": "continuity.admission_gate",',
                  '        "admission_evaluator_version": "1",',
                  '        "admission_rule_id": "continuity.admission.default.v1",',
                  '        "evaluation_evidence_refs": ("policy:evaluation",),',
              ]
              test_lines[rejected_anchor + 1:rejected_anchor + 1] = defaults

          insertion = find_line(
              test_lines,
              "def test_receipt_evaluation_must_follow_drafts_and_be_authorized() -> None:",
          )
          if not any(
              line.startswith("def test_receipt_requires_admission_evaluator_provenance")
              for line in test_lines
          ):
              additional = '''def test_receipt_requires_admission_evaluator_provenance() -> None:
              with pytest.raises(ContinuitySourceAdmissionError, match="non-empty string"):
                  _receipt(admission_evaluator_id="  ")
              with pytest.raises(ContinuitySourceAdmissionError, match="non-empty string"):
                  _receipt(admission_evaluator_version="")
              with pytest.raises(ContinuitySourceAdmissionError, match="non-empty string"):
                  _receipt(admission_rule_id="")
              with pytest.raises(ContinuitySourceAdmissionError, match="cannot be empty"):
                  _receipt(evaluation_evidence_refs=())


          @pytest.mark.parametrize("bad_value", ["policy:evaluation", b"policy", 1, None])
          def test_receipt_evaluation_evidence_rejects_scalar_values(
              bad_value: object,
          ) -> None:
              with pytest.raises(ContinuitySourceAdmissionError, match="iterable"):
                  _receipt(evaluation_evidence_refs=bad_value)


          def test_receipt_evaluation_evidence_rejects_duplicates() -> None:
              with pytest.raises(ContinuitySourceAdmissionError, match="duplicates"):
                  _receipt(
                      evaluation_evidence_refs=(
                          "policy:evaluation",
                          "policy:evaluation",
                      )
                  )


          def test_receipt_evaluator_provenance_is_normalized_and_identity_bound() -> None:
              composed = _receipt(
                  admission_evaluator_id="  caf\u00e9  ",
                  admission_evaluator_version=" 1 ",
                  admission_rule_id=" rule:v1 ",
                  evaluation_evidence_refs=("z", "a"),
              )
              decomposed = _receipt(
                  admission_evaluator_id="cafe\u0301",
                  admission_evaluator_version="1",
                  admission_rule_id="rule:v1",
                  evaluation_evidence_refs=("a", "z"),
              )
              assert composed.receipt_id == decomposed.receipt_id
              assert composed.admission_evaluator_id == "caf\u00e9"
              assert composed.evaluation_evidence_refs == ("a", "z")
              with pytest.raises(ContinuitySourceAdmissionError, match="canonical"):
                  replace(composed, admission_rule_id="different-rule")


          def test_receipt_serialization_separates_source_adapter_and_evaluator() -> None:
              payload = _receipt().to_dict()
              assert payload["adapter_id"] == "continuity.state_to_signal_draft"
              assert payload["admission_evaluator_id"] == "continuity.admission_gate"
              assert payload["admission_evaluator_version"] == "1"
              assert payload["admission_rule_id"] == "continuity.admission.default.v1"
              assert payload["evaluation_evidence_refs"] == ["policy:evaluation"]


          '''.splitlines()
              test_lines[insertion:insertion] = additional
          tests.write_text("\n".join(test_lines) + "\n")

          architecture = Path("docs/research/CONTINUITY_SOURCE_ADMISSION_ARCHITECTURE.md")
          doc_lines = architecture.read_text().splitlines()
          receipt_start = find_line(doc_lines, "ContinuityObservationAdmissionReceipt")
          adapter_line = find_line(doc_lines, "├── adapter_id / version", receipt_start)
          if "├── admission_evaluator_id / version" not in doc_lines[adapter_line:adapter_line + 8]:
              doc_lines[adapter_line] = "├── adapter_id / version              # source adapter"
              doc_lines[adapter_line + 1:adapter_line + 1] = [
                  "├── admission_evaluator_id / version",
                  "├── admission_rule_id",
                  "├── evaluation_evidence_refs[]",
              ]
          rule_line = find_line(
              doc_lines,
              "The receipt cannot authorize persistence, execution, Canon writes or user-visible output.",
              receipt_start,
          )
          provenance_paragraph = (
              "The source adapter and admission evaluator are separate provenance axes. "
              "Evaluator ID/version, admission rule ID and nonempty evaluation evidence "
              "are mandatory and enter receipt identity. These fields are evidence "
              "references only: a future admission gate must resolve and allowlist the "
              "evaluator/rule and verify current policy, authorization, restriction and "
              "erasure state rather than trusting caller-supplied strings."
          )
          if provenance_paragraph not in "\n".join(doc_lines[rule_line + 1:rule_line + 8]):
              doc_lines[rule_line + 1:rule_line + 1] = ["", provenance_paragraph]
          architecture.write_text("\n".join(doc_lines) + "\n")
          PY

      - name: Focused validation
        run: |
          python -m ruff check core/continuity/source_admission_decisions.py tests/test_continuity_source_admission_decisions.py
          python -m mypy core/continuity/source_admission_decisions.py
          python -m pytest tests/test_continuity_source_admission_decisions.py -q

      - name: Remove temporary workflow and commit final diff
        run: |
          rm .github/workflows/temporary-add-admission-evaluator-provenance.yml
          git config user.name "Velantim"
          git config user.email "velantrim@gmail.com"
          git add core/continuity/source_admission_decisions.py tests/test_continuity_source_admission_decisions.py docs/research/CONTINUITY_SOURCE_ADMISSION_ARCHITECTURE.md .github/workflows/temporary-add-admission-evaluator-provenance.yml
          git commit -m "fix(continuity): bind admission evaluator provenance"
          git push origin HEAD:feat/continuity-source-admission-decisions
