name: One-shot migrate CognitiveFactStore through gateway

on:
  pull_request:
    branches:
      - main

concurrency:
  group: cognitive-store-promotion-gateway-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/promotion-gateway-cognitive-store'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotion-gateway-cognitive-store
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[server,dev,embeddings,retrieval]"

      - name: Apply exact CognitiveFactStore migration
        run: |
          python scripts/apply_cognitive_store_promotion_gateway.py
          python -m py_compile \
            core/cognitive_store.py \
            tests/test_cognitive_store.py \
            tests/test_cognitive_store_promotion_gateway.py

      - name: Run focused cognitive-store and gateway suites
        run: |
          python -m pytest -q \
            tests/test_cognitive_store.py \
            tests/test_cognitive_store_promotion_gateway.py \
            tests/test_promotion_gateway.py \
            tests/test_promotion_gateway_reload_contract.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-cognitive-store-promotion-gateway.yml
          rm scripts/apply_cognitive_store_promotion_gateway.py

      - name: Commit final CognitiveFactStore migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/cognitive_store.py \
            tests/test_cognitive_store.py \
            tests/test_cognitive_store_promotion_gateway.py \
            docs/adr/ADR-2026-08-03-promotion-gateway-cognitive-store.md \
            .github/workflows/apply-cognitive-store-promotion-gateway.yml \
            scripts/apply_cognitive_store_promotion_gateway.py
          git commit -m "fix(promotion): gate CognitiveFactStore validation"
          git fetch origin agent/promotion-gateway-cognitive-store
          git rebase origin/agent/promotion-gateway-cognitive-store
          git push origin HEAD:agent/promotion-gateway-cognitive-store
