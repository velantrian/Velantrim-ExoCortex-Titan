name: One-shot SQLite resilience baseline

on:
  pull_request:
    branches:
      - main

concurrency:
  group: sqlite-resilience-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  characterize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/sqlite-resilience-characterization'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sqlite-resilience-characterization
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev]"

      - name: Run 1/10/25/50/100 writer probe
        run: |
          python scripts/sqlite_store_probe.py \
            --writers 1,10,25,50,100 \
            --output /tmp/sqlite-concurrency-baseline.json

      - name: Run crash and mixed-concurrency suite
        run: python -m pytest -q tests/test_sqlite_store_resilience.py

      - name: Publish reproducible baseline and remove one-shot workflow
        run: |
          mkdir -p docs/evidence
          cp /tmp/sqlite-concurrency-baseline.json \
            docs/evidence/sqlite-concurrency-baseline-2026-08-03.json
          rm .github/workflows/run-sqlite-resilience-baseline.yml

      - name: Commit final resilience evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/evidence/sqlite-concurrency-baseline-2026-08-03.json \
            .github/workflows/run-sqlite-resilience-baseline.yml
          git commit -m "test(storage): publish SQLite resilience baseline"
          git fetch origin agent/sqlite-resilience-characterization
          git rebase origin/agent/sqlite-resilience-characterization
          git push origin HEAD:agent/sqlite-resilience-characterization
