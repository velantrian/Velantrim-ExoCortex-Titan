name: Temporary final Truth Foundation closure

on:
  push:
    branches:
      - staging/final-truth-foundation-closure-20260812

permissions:
  contents: write

jobs:
  patch-docs:
    if: "!contains(github.event.head_commit.message, '[final-truth-closure-candidate]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply exact closure patch
        run: python .github/tmp_final_truth_closure_patch.py
      - name: Remove helpers and validate net scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/tmp_final_truth_closure_patch.py
          rm .github/workflows/tmp-final-truth-closure.yml
          git add -A
          python - <<'PY'
          import subprocess
          expected = sorted([
              'docs/adr/ADR-2026-08-12-smart-kb-fact-build-authority.md',
              'docs/ai/COMPONENT_MAP.md',
              'docs/ai/KNOWN_RISKS.md',
              'docs/ai/WORK_LOG.md',
          ])
          actual = sorted(filter(None, subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', 'origin/main'], text=True
          ).splitlines()))
          print('NET ACTUAL:', actual)
          print('EXPECTED:', expected)
          if actual != expected:
              raise SystemExit('unexpected net file scope')
          PY
          git diff --cached --check
          grep -Fq 'CLOSED_COMPLETED at current main `c80c8d47588de3d2607c7e1b10aa1677eb84383f`' docs/ai/COMPONENT_MAP.md
          grep -Fq 'parent #50' docs/ai/KNOWN_RISKS.md
          grep -Fq 'REAL_GAP=0' docs/ai/WORK_LOG.md
          grep -Fq -- '- Status: Accepted' docs/adr/ADR-2026-08-12-smart-kb-fact-build-authority.md
          if grep -Fq 'Candidate #293 review boundary:' docs/ai/COMPONENT_MAP.md; then exit 1; fi
          if grep -Fq '## P0 — Smart-KB fact-build authority remains review-stage' docs/ai/KNOWN_RISKS.md; then exit 1; fi
      - name: Commit clean closure candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[final-truth-closure-candidate] reconcile #50 completion truth'
          git push origin HEAD:staging/final-truth-foundation-closure-20260812
