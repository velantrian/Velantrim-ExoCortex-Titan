name: One-shot apply TruthPolicy query wiring

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/truth-policy-query-fail-closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/truth-policy-query-fail-closed
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev,embeddings,retrieval]"

      - name: Apply exact query patch
        run: |
          python scripts/apply_truth_policy_query_wiring.py
          python -m py_compile \
            server.py \
            core/truth_policy_runtime.py \
            tests/test_truth_policy_runtime.py \
            tests/test_truth_policy_configured_runtime.py \
            tests/test_truth_policy_query_wiring.py

      - name: Run focused TruthPolicy suites
        env:
          VELANTRIM_ALLOW_OPEN: "true"
        run: |
          python -m pytest -q \
            tests/test_truth_policy.py \
            tests/test_truth_policy_runtime.py \
            tests/test_truth_policy_configured_runtime.py \
            tests/test_truth_policy_query_wiring.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-truth-policy-query-wiring.yml
          rm scripts/apply_truth_policy_query_wiring.py

      - name: Commit final query wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server.py \
            core/truth_policy_runtime.py \
            tests/test_truth_policy_configured_runtime.py \
            tests/test_truth_policy_query_wiring.py \
            docs/operations/truth-policy-query-wiring.md \
            .github/workflows/apply-truth-policy-query-wiring.yml \
            scripts/apply_truth_policy_query_wiring.py
          git commit -m "fix(truth): fail closed in query runtime"
          git fetch origin agent/truth-policy-query-fail-closed
          git rebase origin/agent/truth-policy-query-fail-closed
          git push origin HEAD:agent/truth-policy-query-fail-closed
