name: One-shot migrate validate_fact tool through gateway

on:
  pull_request:
    branches:
      - main

concurrency:
  group: tool-handler-promotion-gateway-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/promotion-gateway-tool-handler'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotion-gateway-tool-handler
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev,embeddings,retrieval]"

      - name: Apply exact tool-handler migration
        run: |
          python scripts/apply_tool_handler_promotion_gateway.py
          python -m py_compile \
            core/tool_handlers.py \
            tests/test_tool_handler_promotion_gateway_wiring.py \
            tests/test_tool_handlers.py

      - name: Run focused tool-handler and gateway suites
        run: |
          python -m pytest -q \
            tests/test_tool_handler_promotion_gateway_wiring.py \
            tests/test_tool_handlers.py \
            tests/test_promotion_gateway.py \
            tests/test_promotion_gateway_reload_contract.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-tool-handler-promotion-gateway.yml
          rm scripts/apply_tool_handler_promotion_gateway.py

      - name: Commit final tool-handler migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/tool_handlers.py \
            tests/test_tool_handler_promotion_gateway_wiring.py \
            docs/adr/ADR-2026-08-03-promotion-gateway-tool-handler.md \
            .github/workflows/apply-tool-handler-promotion-gateway.yml \
            scripts/apply_tool_handler_promotion_gateway.py
          git commit -m "refactor(promotion): route validate_fact through gateway"
          git fetch origin agent/promotion-gateway-tool-handler
          git rebase origin/agent/promotion-gateway-tool-handler
          git push origin HEAD:agent/promotion-gateway-tool-handler
