name: STAGING — PR296 AI truth docs

on:
  push:
    branches: [staging/pr296-ai-docs-20260813]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Patch exact AI truth anchors
        run: python scripts/tmp_patch_pr296_ai_docs.py
      - name: Commit only reconciled docs and remove staging helpers
        shell: bash
        run: |
          rm scripts/tmp_patch_pr296_ai_docs.py
          rm .github/workflows/stage-pr296-ai-docs.yml
          git config user.name "Velantim"
          git config user.email "velantrim@gmail.com"
          git add docs/ai/COMPONENT_MAP.md docs/ai/KNOWN_RISKS.md docs/ai/WORK_LOG.md scripts/tmp_patch_pr296_ai_docs.py .github/workflows/stage-pr296-ai-docs.yml
          git diff --cached --stat
          git commit -m "docs(ai): record ModelFreeCore Phase 1 review state"
          git push origin HEAD:staging/pr296-ai-docs-20260813
