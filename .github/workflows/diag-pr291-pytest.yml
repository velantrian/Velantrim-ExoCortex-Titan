name: Diagnostic PR291 pytest capture

on:
  push:
    branches:
      - diag/pr291-pytest-20260812

permissions:
  contents: write

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, '[diag-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies (uv)
        uses: ./.github/actions/sync-python-deps
        with:
          extras: server dev parsers retrieval embeddings graph-lab
      - name: Capture first pytest failure
        shell: bash
        env:
          PYTHONUNBUFFERED: 1
          VELANTRIM_DB_PATH: "${{ runner.temp }}/velantrim-ci.db"
          VELANTRIM_NGRAM_DB: "${{ runner.temp }}/velantrim-ngram-ci.db"
          VELANTRIM_API_KEY: "ci-test-key"
        run: |
          set +e
          python -m pytest tests/ -q --tb=long --timeout=300 -x > /tmp/pr291-pytest.txt 2>&1
          status=$?
          set -e
          mkdir -p diagnostics
          {
            echo "CANDIDATE_HEAD=599e4fb61a03b00971bfc06f597d7b2eca2ac61a"
            echo "WORKFLOW_HEAD=${GITHUB_SHA}"
            echo "PYTEST_EXIT=${status}"
            echo "--- PYTEST OUTPUT ---"
            cat /tmp/pr291-pytest.txt
          } > diagnostics/pr291-pytest.txt
      - name: Commit diagnostic report to diagnostic branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pr291-pytest.txt
          git commit -m "[diag-report] capture PR291 pytest failure"
          git push origin HEAD:diag/pr291-pytest-20260812
