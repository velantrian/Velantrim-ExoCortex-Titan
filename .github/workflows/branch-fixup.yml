name: Temporary branch fixup

on:
  push:
    branches:
      - continuity/admission-artifact-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: continuity/admission-artifact-lifecycle

      - name: Restore method separation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/continuity/admission_artifact_lifecycle.py")
          text = path.read_text(encoding="utf-8")
          old = "        return artifact, append_receipt_id\n    @staticmethod\n    def _receipt_from_row"
          new = "        return artifact, append_receipt_id\n\n    @staticmethod\n    def _receipt_from_row"
          if text.count(old) != 1:
              raise SystemExit("expected exact method boundary")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit exact branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/continuity/admission_artifact_lifecycle.py
          git commit -m "style(continuity): restore method separation"
          git push origin HEAD:continuity/admission-artifact-lifecycle
