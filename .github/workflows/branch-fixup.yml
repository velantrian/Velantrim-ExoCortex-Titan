name: Temporary branch fixup

on:
  push:
    branches:
      - continuity/admission-artifact-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: continuity/admission-artifact-lifecycle

      - name: Restore exact lifecycle method
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/continuity/admission_artifact_lifecycle.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    @staticmethod\ndef _artifact_from_row(")
          end = text.index(
              "    @staticmethod\n    def _receipt_from_row",
              start,
          )
          new_method = "\n".join(
              [
                  "    @staticmethod",
                  "    def _artifact_from_row(",
                  "        row: sqlite3.Row,",
                  "    ) -> tuple[ContinuityAdmissionArtifact, str]:",
                  "        try:",
                  "            artifact = ContinuityAdmissionArtifact(",
                  "                artifact_id=row[\"artifact_id\"],",
                  "                integrity_digest=row[\"integrity_digest\"],",
                  "                tenant_ref=row[\"tenant_ref\"],",
                  "                principal_context_id=row[\"principal_context_id\"],",
                  "                authorization_context_id=row[\"authorization_context_id\"],",
                  "                subject_refs=_stored_subjects(row[\"subject_refs_json\"]),",
                  "                policy_snapshot_id=row[\"policy_snapshot_id\"],",
                  "                retention_policy_id=row[\"retention_policy_id\"],",
                  "                erasure_domain_refs=_stored_strings(",
                  "                    row[\"erasure_domain_refs_json\"],",
                  "                    \"erasure_domain_refs_json\",",
                  "                ),",
                  "                recorded_at=_parse_datetime(row[\"recorded_at\"], \"recorded_at\"),",
                  "                retained_until=_parse_datetime(",
                  "                    row[\"retained_until\"],",
                  "                    \"retained_until\",",
                  "                ),",
                  "                payload_json=row[\"payload_json\"],",
                  "                schema_version=row[\"schema_version\"],",
                  "            )",
                  "            append_receipt_id = _hash(",
                  "                row[\"append_receipt_id\"],",
                  "                \"append_receipt_id\",",
                  "            )",
                  "        except ContinuityArtifactLifecycleError:",
                  "            raise",
                  "        except ContinuitySourceAdmissionError as exc:",
                  "            raise ContinuityArtifactLifecycleError(",
                  "                f\"stored artifact failed lifecycle validation: {exc}\"",
                  "            ) from exc",
                  "        return artifact, append_receipt_id",
                  "",
              ]
          )
          path.write_text(text[:start] + new_method + text[end:], encoding="utf-8")
          PY

      - name: Commit exact branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/continuity/admission_artifact_lifecycle.py
          git commit -m "fix(continuity): restore lifecycle validation boundary"
          git push origin HEAD:continuity/admission-artifact-lifecycle
