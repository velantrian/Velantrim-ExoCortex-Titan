name: Temporary branch fixup

on:
  push:
    branches:
      - continuity/admission-artifact-lifecycle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: continuity/admission-artifact-lifecycle

      - name: Apply exact mypy fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/continuity/admission_artifact_lifecycle.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "receipts = self._receipts_for_request(connection, request_id)":
                  "previous_receipts = self._receipts_for_request(connection, request_id)",
              "return receipts\n            rows = connection.execute(":
                  "return previous_receipts\n            rows = connection.execute(",
              "receipts: list[ContinuityNeutralizationReceipt] = []":
                  "new_receipts: list[ContinuityNeutralizationReceipt] = []",
              "receipts.append(receipt)": "new_receipts.append(receipt)",
              "return tuple(receipts)": "return tuple(new_receipts)",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit exact branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/continuity/admission_artifact_lifecycle.py
          git commit -m "fix(continuity): resolve strict mypy local typing"
          git push origin HEAD:continuity/admission-artifact-lifecycle
