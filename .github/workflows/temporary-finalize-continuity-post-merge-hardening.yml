name: Temporary finalize Continuity post-merge hardening

on:
  push:
    branches:
      - fix/continuity-final-review-hardening

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: "${{ !contains(github.event.head_commit.message, 'continuity-post-merge-hardened') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/continuity-final-review-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply exact review hardening patch
        run: |
          python scripts/temporary_finalize_continuity_post_merge_hardening.py
          python scripts/temporary_preserve_continuity_schema_reason.py
      - name: Install and validate focused Continuity surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m ruff check core/continuity tests/test_continuity_signal_producer_review_regressions.py
          python -m mypy core/continuity core/compute_controller.py --show-error-codes
          python -m pytest tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py tests/test_continuity_signal_producer_review_regressions.py
      - name: Commit tested patch and remove temporary files
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add core/continuity/signal_producer.py docs/ai/WORK_LOG.md tests/test_continuity_signal_producer_review_regressions.py
          git rm .github/workflows/temporary-finalize-continuity-post-merge-hardening.yml
          git rm scripts/temporary_finalize_continuity_post_merge_hardening.py
          git rm scripts/temporary_preserve_continuity_schema_reason.py
          git commit -m "fix(continuity): harden post-merge trusted observations [continuity-post-merge-hardened]"
          git push origin HEAD:fix/continuity-final-review-hardening
