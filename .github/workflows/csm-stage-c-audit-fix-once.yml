name: CSM Stage C audit fix applicator

on:
  push:
    branches:
      - agent/csm-stage-c-bounded-scanner
    paths:
      - .github/workflows/csm-stage-c-audit-fix-once.yml

permissions:
  contents: write

jobs:
  apply-exact-audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply SHA-guarded scanner patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import hashlib

          path = Path("core/code_structural_memory/scanner.py")
          raw = path.read_bytes()

          def blob_sha(payload: bytes) -> str:
              header = f"blob {len(payload)}\0".encode()
              return hashlib.sha1(header + payload).hexdigest()

          expected_before = "91d9387b37f69b965fdadd9698a56b02d51e6744"
          expected_after = "38636b511d098c4347f4ce082f2e126d493f1524"
          actual_before = blob_sha(raw)
          if actual_before != expected_before:
              raise SystemExit(
                  f"scanner drifted before audit fix: {actual_before} != {expected_before}"
              )

          text = raw.decode("utf-8")
          old_read = "\n".join([
              "        if total_bytes + size > budget.max_total_bytes:",
              "            problems.append(",
              "                _problem(",
              "                    relative_path=relative_path,",
              "                    reason=\"TOTAL_BYTE_LIMIT\",",
              "                    observed_bytes=size,",
              "                )",
              "            )",
              "            continue",
              "",
              "        try:",
              "            raw = resolved.read_bytes()",
              "        except OSError:",
              "            problems.append(",
              "                _problem(relative_path=relative_path, reason=\"READ_ERROR\", is_error=True)",
              "            )",
              "            continue",
              "",
          ])
          new_read = "\n".join([
              "        remaining_total_bytes = budget.max_total_bytes - total_bytes",
              "        if remaining_total_bytes <= 0 or size > remaining_total_bytes:",
              "            problems.append(",
              "                _problem(",
              "                    relative_path=relative_path,",
              "                    reason=\"TOTAL_BYTE_LIMIT\",",
              "                    observed_bytes=size,",
              "                )",
              "            )",
              "            continue",
              "",
              "        # Charge aggregate budget for bytes actually inspected, including files that",
              "        # are later rejected by decode/parse checks. Read one look-ahead byte only",
              "        # to detect growth after stat without allowing an unbounded read.",
              "        read_cap = min(budget.max_file_bytes, remaining_total_bytes)",
              "        try:",
              "            with resolved.open(\"rb\", buffering=0) as source:",
              "                raw = source.read(read_cap + 1)",
              "        except OSError:",
              "            problems.append(",
              "                _problem(relative_path=relative_path, reason=\"READ_ERROR\", is_error=True)",
              "            )",
              "            # The read request itself was bounded, but an exception gives no",
              "            # trustworthy byte count. Stop rather than spend an unknown remainder.",
              "            break",
              "",
              "        total_bytes += len(raw)",
              "        if len(raw) > read_cap:",
              "            overflow_reason = (",
              "                \"TOTAL_BYTE_LIMIT\"",
              "                if remaining_total_bytes <= budget.max_file_bytes",
              "                else \"FILE_SIZE_LIMIT\"",
              "            )",
              "            problems.append(",
              "                _problem(",
              "                    relative_path=relative_path,",
              "                    reason=overflow_reason,",
              "                    observed_bytes=len(raw),",
              "                    is_error=True,",
              "                )",
              "            )",
              "            continue",
              "",
          ])
          old_late = "\n".join([
              "        total_bytes += len(raw)",
              "        parsed.append(",
          ])
          new_late = "        parsed.append("

          if text.count(old_read) != 1:
              raise SystemExit("expected read-budget block was not found exactly once")
          if text.count(old_late) != 1:
              raise SystemExit("expected late byte-accounting block was not found exactly once")
          text = text.replace(old_read, new_read, 1).replace(old_late, new_late, 1)
          candidate = text.encode("utf-8")
          ast.parse(text)
          actual_after = blob_sha(candidate)
          if actual_after != expected_after:
              raise SystemExit(
                  f"patched scanner SHA mismatch: {actual_after} != {expected_after}"
              )
          path.write_bytes(candidate)
          print(f"scanner patch verified: {actual_before} -> {actual_after}")
          PY

          git diff --check -- core/code_structural_memory/scanner.py

      - name: Commit patch and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/csm-stage-c-audit-fix-once.yml
          git add core/code_structural_memory/scanner.py
          git commit -m "fix(csm): enforce total-byte read budget after audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
