name: CI — Velantrim Titan 9.0

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies (uv)
        uses: ./.github/actions/sync-python-deps
        with:
          extras: server dev parsers retrieval embeddings graph-lab

      - name: Version/branding guard
        run: python scripts/check_version_branding.py

      - name: Repo hygiene guard (no tracked runtime/test-cache artifacts)
        run: python scripts/check_no_tracked_artifacts.py

      - name: Architecture freeze guard (ADR required for new authority)
        run: python scripts/check_architecture_freeze.py

      - name: Machine-readable project-state guard
        run: python scripts/check_project_state.py

      - name: Portable KB graph integrity guard
        run: python scripts/validate_kb_graph.py kb_graph.json

      - name: Ruff check (lint)
        run: ruff check core/ --output-format=github

      - name: Mypy check (type safety · BLOCKING)
        run: mypy core/ --show-error-codes

      - name: Pytest
        run: python -m pytest tests/ -v --tb=short --timeout=300 -x
        continue-on-error: false
        env:
          PYTHONUNBUFFERED: 1
          VELANTRIM_DB_PATH: "${{ runner.temp }}/velantrim-ci.db"
          VELANTRIM_NGRAM_DB: "${{ runner.temp }}/velantrim-ngram-ci.db"
          VELANTRIM_API_KEY: "ci-test-key"

  coverage:
    name: Coverage ratchet (core ≥74%)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies (uv)
        uses: ./.github/actions/sync-python-deps
        with:
          extras: server dev parsers retrieval embeddings graph-lab

      - name: Run full core coverage
        run: |
          # coverage.py installs tracing hooks. The excluded stress families
          # concurrently install per-thread trace hooks and are still exercised
          # by the blocking lint-and-test job above.
          python -m coverage run -m pytest tests/ -q --tb=short --timeout=300 \
            -k "not test_concurrent_fresh_bootstrap_add_column_no_duplicate_error and not test_concurrent_fresh_bootstrap_on_seeded_db_creates_exactly_one_view"
          python -m coverage report --show-missing --fail-under=74
          python -m coverage xml -o coverage.xml
        env:
          PYTHONUNBUFFERED: 1
          VELANTRIM_DB_PATH: "${{ runner.temp }}/velantrim-coverage.db"
          VELANTRIM_NGRAM_DB: "${{ runner.temp }}/velantrim-ngram-coverage.db"
          VELANTRIM_API_KEY: "ci-test-key"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: titan-core-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  sbom:
    name: Deterministic lock SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Generate and verify deterministic SBOM
        run: |
          mkdir -p artifacts
          python scripts/generate_sbom.py --output artifacts/titan-uv-lock.cdx.json
          python scripts/generate_sbom.py --output "${RUNNER_TEMP}/titan-uv-lock.second.cdx.json"
          cmp artifacts/titan-uv-lock.cdx.json "${RUNNER_TEMP}/titan-uv-lock.second.cdx.json"
          python -m json.tool artifacts/titan-uv-lock.cdx.json >/dev/null
          sha256sum artifacts/titan-uv-lock.cdx.json > artifacts/titan-uv-lock.cdx.json.sha256

      - name: Upload deterministic SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: titan-lock-sbom
          path: |
            artifacts/titan-uv-lock.cdx.json
            artifacts/titan-uv-lock.cdx.json.sha256
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install repository uv version
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.3
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Audit frozen lock graph and capture evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts
          set +e
          uv --preview-features audit-command,json-output audit \
            --frozen \
            --output-format json \
            > artifacts/titan-dependency-audit.json
          audit_status=$?
          set -e
          python -m json.tool artifacts/titan-dependency-audit.json >/dev/null
          lock_sha="$(sha256sum uv.lock | awk '{print $1}')"
          printf '%s\n' "${audit_status}" > artifacts/titan-dependency-audit.exit-code
          printf 'uv_version=0.12.3\nservice=osv\nservice_url=https://api.osv.dev/\nlock_sha256=%s\nexit_code=%s\n' \
            "${lock_sha}" "${audit_status}" \
            > artifacts/titan-dependency-audit.metadata.txt
          sha256sum artifacts/titan-dependency-audit.json \
            > artifacts/titan-dependency-audit.json.sha256

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: titan-dependency-audit
          path: |
            artifacts/titan-dependency-audit.json
            artifacts/titan-dependency-audit.json.sha256
            artifacts/titan-dependency-audit.metadata.txt
            artifacts/titan-dependency-audit.exit-code
          if-no-files-found: error
          retention-days: 14

      - name: Fail closed on reported vulnerability or audit error
        run: |
          set -euo pipefail
          audit_status="$(cat artifacts/titan-dependency-audit.exit-code)"
          if [ "${audit_status}" -ne 0 ]; then
            echo "::error::uv audit reported a vulnerability/adverse status or could not complete; inspect titan-dependency-audit artifact"
            cat artifacts/titan-dependency-audit.json
            exit "${audit_status}"
          fi
