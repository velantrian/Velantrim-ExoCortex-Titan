name: Diagnostic — trace SQLite disk-full write path

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-sqlite-disk-full-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  trace-write-path:
    if: github.head_ref == 'agent/sqlite-disk-full-characterization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev]"

      - name: Trace the public store write path
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from core.memory import SQLiteGraphStore

          def fact(fact_id: str, padding_bytes: int = 0):
              metadata = {"disk_full_test": True}
              if padding_bytes:
                  metadata["padding"] = "x" * padding_bytes
              return {
                  "fact_id": fact_id,
                  "claim": f"SQLite disk-full rollback fact {fact_id}",
                  "source": "sqlite_disk_full_test",
                  "confidence": 0.8,
                  "metadata": metadata,
              }

          root = Path(tempfile.mkdtemp())
          db_path = root / "disk-full.db"
          store = SQLiteGraphStore(str(db_path))
          store.store_fact(fact("preexisting"))
          with store._db() as conn:
              print("TRACE connection_before", id(conn), flush=True)
              page_count = int(conn.execute("PRAGMA page_count").fetchone()[0])
              page_size = int(conn.execute("PRAGMA page_size").fetchone()[0])
              target = page_count + 1
              applied = int(conn.execute(f"PRAGMA max_page_count = {target}").fetchone()[0])
              print("TRACE before", page_count, page_size, target, applied, flush=True)

          payload = fact("must-rollback", page_size * 256)
          try:
              result = store.store_fact_result(payload)
              print("TRACE store_fact_result", repr(result), flush=True)
          except Exception as exc:
              print("TRACE exception", type(exc).__name__, repr(str(exc)), flush=True)

          with store._db() as conn:
              print("TRACE connection_after", id(conn), flush=True)
              print("TRACE after_page_count", conn.execute("PRAGMA page_count").fetchone()[0], flush=True)
              print("TRACE after_max_page_count", conn.execute("PRAGMA max_page_count").fetchone()[0], flush=True)
              print("TRACE durable_fact_count", conn.execute("SELECT COUNT(*) FROM facts WHERE fact_id = ?", ("must-rollback",)).fetchone()[0], flush=True)
          print("TRACE public_fact", store.get_fact("must-rollback"), flush=True)
          store.close()
          PY
