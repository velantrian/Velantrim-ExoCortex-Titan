name: One-shot migrate API Validated transition through gateway

on:
  pull_request:
    branches:
      - main

concurrency:
  group: api-transition-promotion-gateway-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/promotion-gateway-api-transition'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotion-gateway-api-transition
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused server dependencies
        run: pip install -e ".[server,dev,embeddings,retrieval]"

      - name: Apply exact API migration
        run: |
          python scripts/apply_api_transition_promotion_gateway.py
          python -m py_compile \
            core/promotion_gateway.py \
            server.py \
            tests/test_api_promotion_gateway_wiring.py \
            tests/test_promotion_gateway_transient_justification.py \
            tests/test_truthgate_api_transition.py

      - name: Run focused API and gateway suites
        env:
          VELANTRIM_API_KEY: focused-test-key
          VELANTRIM_ALLOW_OPEN: "false"
          LLM_PROVIDER: none
          SLEEP_WORKER_ENABLED: "false"
        run: |
          python -m pytest -q \
            tests/test_api_promotion_gateway_wiring.py \
            tests/test_promotion_gateway_transient_justification.py \
            tests/test_promotion_gateway.py \
            tests/test_promotion_gateway_reload_contract.py \
            tests/test_truthgate_api_transition.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-api-transition-promotion-gateway.yml
          rm scripts/apply_api_transition_promotion_gateway.py

      - name: Commit final API transition migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/promotion_gateway.py \
            server.py \
            tests/test_api_promotion_gateway_wiring.py \
            tests/test_promotion_gateway_transient_justification.py \
            docs/adr/ADR-2026-08-02-promotion-gateway-api-transition.md \
            .github/workflows/apply-api-transition-promotion-gateway.yml \
            scripts/apply_api_transition_promotion_gateway.py
          git commit -m "refactor(promotion): route API transition through gateway"
          git fetch origin agent/promotion-gateway-api-transition
          git rebase origin/agent/promotion-gateway-api-transition
          git push origin HEAD:agent/promotion-gateway-api-transition
