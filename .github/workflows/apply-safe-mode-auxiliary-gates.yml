name: One-shot apply SAFE_MODE auxiliary mutation gates

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/safe-mode-auxiliary-mutation-gates'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/safe-mode-auxiliary-mutation-gates
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev,embeddings,retrieval]"

      - name: Apply exact auxiliary gate patch
        run: |
          python scripts/apply_safe_mode_auxiliary_gates.py
          python -m py_compile \
            core/mutation_gate.py \
            core/goal_stack.py \
            core/console_notes.py \
            core/memory_ops.py \
            tests/test_safe_mode_auxiliary_mutations.py

      - name: Run focused SAFE_MODE suites
        run: |
          python -m pytest -q \
            tests/test_safe_mode_writes_blocked.py \
            tests/test_safe_mode_auxiliary_mutations.py \
            tests/test_goal_stack.py \
            tests/test_console_notes.py \
            tests/test_memory_ops.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-safe-mode-auxiliary-gates.yml
          rm scripts/apply_safe_mode_auxiliary_gates.py

      - name: Commit final auxiliary mutation gates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/mutation_gate.py \
            core/goal_stack.py \
            core/console_notes.py \
            core/memory_ops.py \
            tests/test_safe_mode_auxiliary_mutations.py \
            docs/operations/safe-mode-mutation-boundary.md \
            docs/adr/ADR-2026-08-02-safe-mode-auxiliary-mutations.md \
            .github/workflows/apply-safe-mode-auxiliary-gates.yml \
            scripts/apply_safe_mode_auxiliary_gates.py
          git commit -m "feat(policy): gate auxiliary mutations in SAFE_MODE"
          git fetch origin agent/safe-mode-auxiliary-mutation-gates
          git rebase origin/agent/safe-mode-auxiliary-mutation-gates
          git push origin HEAD:agent/safe-mode-auxiliary-mutation-gates
