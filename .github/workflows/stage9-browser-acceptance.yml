name: Stage 9 — Browser acceptance

on:
  pull_request:
    paths:
      - "scripts/stage9_browser_acceptance.py"
      - "static/console/**"
      - "server.py"
      - "core/**"
      - "api/**"
      - ".github/workflows/stage9-browser-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install Titan bounded runtime
        run: |
          python -m pip install --disable-pip-version-check -e '.[server,parsers]'

      - name: Install browser test dependency
        run: |
          python -m pip install --disable-pip-version-check 'playwright>=1.48,<2'
          python -m playwright install --with-deps chromium

      - name: Run real Chromium acceptance
        run: python scripts/stage9_browser_acceptance.py
