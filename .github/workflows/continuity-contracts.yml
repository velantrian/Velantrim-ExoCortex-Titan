name: Continuity contracts

on:
  pull_request:
    paths:
      - "core/continuity/**"
      - "core/compute_controller.py"
      - "tests/test_continuity*.py"
      - "tests/fixtures/continuity_contracts_v1.json"
      - ".github/workflows/continuity-contracts.yml"
  push:
    branches: [main, master]
    paths:
      - "core/continuity/**"
      - "core/compute_controller.py"
      - "tests/test_continuity*.py"
      - "tests/fixtures/continuity_contracts_v1.json"
      - ".github/workflows/continuity-contracts.yml"

permissions:
  contents: read

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked dependencies (uv)
        uses: ./.github/actions/sync-python-deps
        with:
          extras: dev

      - name: Ruff
        run: >-
          ruff check core/continuity core/compute_controller.py
          tests/test_continuity*.py --output-format=github

      - name: Mypy
        run: >-
          mypy core/continuity core/compute_controller.py
          --show-error-codes

      - name: Continuity tests
        run: python -m pytest tests/test_continuity*.py -v --tb=short --timeout=300
