name: C5 temporary two-solve patch exporter

on:
  push:
    branches:
      - agent/issue-52-container-sbom

permissions:
  contents: write

jobs:
  export-two-solve:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate bounded two-solve workflow
        run: |
          set -euo pipefail
          python scripts/c5_two_solve_temp.py
          changed="$(git diff --name-only)"
          if [ "${changed}" != ".github/workflows/docker.yml" ]; then
            echo "::error::two-solve patch changed unexpected files: ${changed}"
            exit 1
          fi
      - name: Export patched workflow as ordinary blob
        run: |
          set -euo pipefail
          mkdir -p tmp/c5
          cp .github/workflows/docker.yml tmp/c5/docker-two-solve.yml
          git restore .github/workflows/docker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp/c5/docker-two-solve.yml
          git commit -m "chore: export exact C5 two-solve blob"
          git push origin "HEAD:${GITHUB_REF_NAME}"
