name: One-shot apply bounded single recovery

on:
  push:
    branches:
      - agent/erasure-bounded-single-recovery

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/erasure-bounded-single-recovery
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev,embeddings,retrieval]"

      - name: Apply exact coordinator patch
        run: |
          python scripts/apply_bounded_single_recovery.py
          python -m py_compile core/erasure_coordinator.py tests/test_erasure_bounded_single_recovery.py

      - name: Run focused bounded recovery tests
        run: |
          python -m pytest -q tests/test_erasure_bounded_single_recovery.py
          python -m pytest -q \
            tests/test_erasure_coordinator.py::test_complete_erasure_purges_facts_embeddings_and_ngram \
            tests/test_erasure_coordinator.py::test_concurrent_erase_calls_on_superseded_candidate_converge_on_one_generation

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-bounded-single-recovery.yml
          rm scripts/apply_bounded_single_recovery.py

      - name: Commit bounded single recovery implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/erasure_coordinator.py \
                  tests/test_erasure_bounded_single_recovery.py \
                  docs/operations/erasure-bounded-single-recovery.md \
                  .github/workflows/apply-bounded-single-recovery.yml \
                  scripts/apply_bounded_single_recovery.py
          git commit -m "feat(erasure): add bounded single-fact recovery"
          git push origin HEAD:agent/erasure-bounded-single-recovery

# Trigger commit: workflow exists on the branch before this push.
