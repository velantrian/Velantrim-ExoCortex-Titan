name: Stage 10 — Bounded pilot

on:
  pull_request:
    paths:
      - "scripts/titan_v1_bounded_pilot.py"
      - "scripts/ingest_file.py"
      - "scripts/titan_tools.py"
      - "server.py"
      - "core/**"
      - "api/**"
      - ".github/workflows/stage10-bounded-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Titan bounded runtime
        run: python -m pip install --disable-pip-version-check -e '.[server,parsers]'

      - name: Run bounded Titan V1 pilot
        run: python scripts/titan_v1_bounded_pilot.py
