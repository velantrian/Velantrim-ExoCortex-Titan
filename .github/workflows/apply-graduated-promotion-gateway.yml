name: One-shot migrate graduated promotion through gateway

on:
  pull_request:
    branches:
      - main
      - agent/promotion-gateway-foundation

concurrency:
  group: graduated-promotion-gateway-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/promotion-gateway-graduated-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotion-gateway-graduated-migration
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev,embeddings,retrieval]"

      - name: Apply exact graduated-promotion migration
        run: |
          python scripts/apply_graduated_promotion_gateway.py
          python -m py_compile \
            core/promotion_gateway.py \
            core/promotion_policy.py \
            tests/test_promotion_gateway.py \
            tests/test_promotion_policy.py \
            tests/test_promotion_policy_gateway_wiring.py

      - name: Run focused promotion suites
        run: |
          python -m pytest -q \
            tests/test_promotion_gateway.py \
            tests/test_promotion_policy.py \
            tests/test_promotion_policy_gateway_wiring.py \
            tests/test_p0d_truthgate_enforcement.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-graduated-promotion-gateway.yml
          rm scripts/apply_graduated_promotion_gateway.py

      - name: Commit final graduated-promotion migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/promotion_policy.py \
            tests/test_promotion_policy_gateway_wiring.py \
            docs/adr/ADR-2026-08-02-promotion-gateway-graduated-caller.md \
            .github/workflows/apply-graduated-promotion-gateway.yml \
            scripts/apply_graduated_promotion_gateway.py
          git commit -m "refactor(promotion): route graduated caller through gateway"
          git fetch origin agent/promotion-gateway-graduated-migration
          git rebase origin/agent/promotion-gateway-graduated-migration
          git push origin HEAD:agent/promotion-gateway-graduated-migration
