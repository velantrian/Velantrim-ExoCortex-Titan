name: Apply issue 249 harness isolation fix

on:
  push:
    branches:
      - agent/issue-249-hosted-cas-characterization
    paths:
      - .github/workflows/apply-issue-249-harness-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out characterization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/issue-249-hosted-cas-characterization
          fetch-depth: 0

      - name: Isolate CAS race from lazy schema bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_promotion_projection_outbox_caller.py")
          text = path.read_text()
          old = '''    stores = [SQLiteGraphStore(str(db_path)) for _ in range(contenders)]
              for contender_id, store in enumerate(stores):
          '''.replace("              ", "")
          new = '''    stores = [SQLiteGraphStore(str(db_path)) for _ in range(contenders)]
              # Issue #249 is a CAS-contention test, not a concurrent schema-bootstrap
              # test. Every independent store owns a per-instance lazy DDL guard, so
              # entering validate_and_promote() concurrently on never-opened stores
              # mixes first-use schema churn into the intended CAS race. Initialize
              # each contender sequentially before installing/releasing the CAS gate;
              # the threaded section below then races only the real promotion path.
              for store in stores:
                  store.ensure_schema()
              for contender_id, store in enumerate(stores):
          '''.replace("              ", "")
          if new in text:
              print("Harness isolation already applied; nothing to do.")
          elif old not in text:
              raise SystemExit("expected harness anchor not found; refusing broad edit")
          else:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit harness isolation
        run: |
          if git diff --quiet -- tests/test_promotion_projection_outbox_caller.py; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_promotion_projection_outbox_caller.py
          git commit -m "test(cas): preinitialize contender stores before race"
          git push origin HEAD:agent/issue-249-hosted-cas-characterization
