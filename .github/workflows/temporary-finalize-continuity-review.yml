name: Temporary finalize Continuity review

on:
  push:
    branches:
      - feat/continuity-trusted-signal-producer

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: "${{ !contains(github.event.head_commit.message, 'continuity-review-cleanup') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-trusted-signal-producer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply final review cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          patches = {
              "core/continuity/observations.py": [
                  (
                      "requirement. Those are business-policy decisions that depend on a caller\n-supplied :class:`~core.continuity.signal_producer.ContinuitySignalPolicy`,",
                      "requirement. Those are business-policy decisions that depend on a\ncaller-supplied :class:`~core.continuity.signal_producer.ContinuitySignalPolicy`,",
                  ),
              ],
              "tests/test_continuity_signal_producer.py": [
                  (
                      "def test_nonempty_input_without_evidence_is_fail_closed() -> None:",
                      "def test_nonempty_input_without_coverage_observations_is_fail_closed() -> None:",
                  ),
              ],
              "tests/test_continuity_producer_determinism.py": [
                  (
                      "    assert assessment.base_decision == assessment.base_decision",
                      "    assert (\n        \"important_claim_requires_conflict_verification\"\n        in assessment.reason_codes\n    )",
                  ),
              ],
          }
          for filename, replacements in patches.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected exactly one occurrence in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install and validate focused Continuity surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m ruff check core/continuity tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py
          python -m mypy core/continuity core/compute_controller.py --show-error-codes
          python -m pytest tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py
      - name: Commit tested cleanup
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add core/continuity/observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py
          git commit -m "test(continuity): finalize review assertions [continuity-review-cleanup]"
          git push origin HEAD:feat/continuity-trusted-signal-producer
