name: CSM P1-B descriptor guard applicator

on:
  push:
    branches:
      - agent/csm-stage-c-bounded-scanner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'velantrian'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact applicator commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Guard exact parent and source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6c287d754e5a33f68c0f4ca1f35c19745a62a58b"
          test "$(git hash-object core/code_structural_memory/scanner.py)" = "38636b511d098c4347f4ce082f2e126d493f1524"
          test "$(git hash-object tests/test_code_structural_memory_stage_c_budget_admission.py)" = "fb5ed42585f8908b40394047a026e0ecc24a91f8"

      - name: Apply descriptor-anchored P1-B repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          scanner_path = Path("core/code_structural_memory/scanner.py")
          text = scanner_path.read_text(encoding="utf-8")

          old = "import ast\nimport hashlib\n"
          new = "import ast\nimport errno\nimport hashlib\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected ast/hashlib import shape")
          text = text.replace(old, new, 1)

          old = "import sqlite3\nimport sys\n"
          new = "import sqlite3\nimport stat\nimport sys\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected sqlite3/sys import shape")
          text = text.replace(old, new, 1)

          start = text.index("def _discover_and_parse(")
          end = text.index("\n\ndef _materialize_candidate(", start)
          replacement = base64.b64decode("").decode("utf-8")
          text = text[:start] + replacement + text[end:]
          scanner_path.write_text(text, encoding="utf-8")

          descriptor_test = base64.b64decode("").decode("utf-8")
          Path("tests/test_code_structural_memory_stage_c_descriptor_guard.py").write_text(
              descriptor_test,
              encoding="utf-8",
          )

          budget_test = base64.b64decode("").decode("utf-8")
          Path("tests/test_code_structural_memory_stage_c_budget_admission.py").write_text(
              budget_test,
              encoding="utf-8",
          )

          Path(".github/workflows/csm-p1b-applicator.yml").unlink()
          PY

          python -m py_compile \
            core/code_structural_memory/scanner.py \
            tests/test_code_structural_memory_stage_c_budget_admission.py \
            tests/test_code_structural_memory_stage_c_descriptor_guard.py
          git diff --check

          python - <<'PY'
          import subprocess

          expected = {
              ".github/workflows/csm-p1b-applicator.yml",
              "core/code_structural_memory/scanner.py",
              "tests/test_code_structural_memory_stage_c_budget_admission.py",
              "tests/test_code_structural_memory_stage_c_descriptor_guard.py",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected changed paths: {sorted(actual)}")
          PY

      - name: Commit exact repair and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(csm): anchor Stage C reads to no-follow descriptors"
          git push origin HEAD:agent/csm-stage-c-bounded-scanner
