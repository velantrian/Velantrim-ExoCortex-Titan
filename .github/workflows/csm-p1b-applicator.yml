name: CSM P1-B descriptor guard applicator

on:
  push:
    branches:
      - agent/csm-stage-c-bounded-scanner

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'velantrian'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Guard exact parent and transport blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7c0f00dd89451915cda0797d025c6d902e6e82e6"
          test "$(git hash-object core/code_structural_memory/scanner.py)" = "38636b511d098c4347f4ce082f2e126d493f1524"
          test "$(git hash-object scripts/.csm_p1b_descriptor_replacement.pyfrag)" = "dbaae34a0e864f62164b28cf6ceeb0d105158062"
          test "$(git hash-object tests/test_code_structural_memory_stage_c_descriptor_guard.py)" = "283aab8e81bfb8b980acc913b6ee34db016020df"
          test "$(git hash-object tests/test_code_structural_memory_stage_c_budget_admission.py)" = "c43baaeb894456ea1aa993c1613ac5b6e49b974e"

      - name: Apply exact descriptor replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          scanner_path = Path("core/code_structural_memory/scanner.py")
          text = scanner_path.read_text(encoding="utf-8")
          replacement_path = Path("scripts/.csm_p1b_descriptor_replacement.pyfrag")
          replacement = replacement_path.read_text(encoding="utf-8")
          ast.parse(replacement)

          old = "import ast\nimport hashlib\n"
          new = "import ast\nimport errno\nimport hashlib\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected ast/hashlib import shape")
          text = text.replace(old, new, 1)

          old = "import sqlite3\nimport sys\n"
          new = "import sqlite3\nimport stat\nimport sys\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected sqlite3/sys import shape")
          text = text.replace(old, new, 1)

          start = text.index("def _discover_and_parse(")
          end = text.index("\n\ndef _materialize_candidate(", start)
          text = text[:start] + replacement + text[end:]
          ast.parse(text)
          scanner_path.write_text(text, encoding="utf-8")

          replacement_path.unlink()
          Path(".github/workflows/csm-p1b-applicator.yml").unlink()
          PY

          python -m py_compile \
            core/code_structural_memory/scanner.py \
            tests/test_code_structural_memory_stage_c_budget_admission.py \
            tests/test_code_structural_memory_stage_c_descriptor_guard.py
          git diff --check

          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/csm-p1b-applicator.yml",
              "core/code_structural_memory/scanner.py",
              "scripts/.csm_p1b_descriptor_replacement.pyfrag",
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != expected:
              raise SystemExit(f"unexpected changed paths: {sorted(actual)}")
          PY

      - name: Commit repair and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(csm): anchor Stage C reads to no-follow descriptors"
          git push origin HEAD:agent/csm-stage-c-bounded-scanner
