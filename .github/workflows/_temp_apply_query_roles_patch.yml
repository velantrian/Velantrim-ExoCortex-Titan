name: Temporary bounded query-roles patch

on:
  push:
    branches:
      - fix/query-roles-truthful-fallback

permissions:
  contents: write

jobs:
  apply-bounded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/query-roles-truthful-fallback
          fetch-depth: 0

      - name: Apply exact server.py patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server.py")
          text = path.read_text(encoding="utf-8")

          old_call = '''        bm = get_branch_manager()
          t0 = time.perf_counter()
          synthesis = await bm.reason(query=req.query, roles=role_list)
          '''
          new_call = '''        bm = get_branch_manager()
          t0 = time.perf_counter()
          synthesis = await bm.reason(
              query=req.query,
              roles=role_list,
              llm_config=_env_llm_config(),
          )
          '''

          old_llm = "            llm_answer=synthesis.response,"
          new_llm = (
              "            llm_answer=(\n"
              "                synthesis.response if synthesis.all_branches_used_llm else None\n"
              "            ),"
          )

          old_lens = '                "branches": [b.to_dict() for b in synthesis.branches],'
          new_lens = (
              '                "branches": [b.to_dict() for b in synthesis.branches],\n'
              '                "all_branches_used_llm": synthesis.all_branches_used_llm,'
          )

          for old, label in ((old_call, "reason call"), (old_llm, "llm_answer"), (old_lens, "lens context")):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one {label} match, got {count}")

          text = text.replace(old_call, new_call)
          text = text.replace(old_llm, new_llm)
          text = text.replace(old_lens, new_lens)
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile server.py
          git diff --check
          git diff -- server.py

      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- server.py; then
            echo "No server.py change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "fix(server): report query roles LLM provenance truthfully"
          git push origin HEAD:fix/query-roles-truthful-fallback
