name: Temporary endpoint-scoped query-roles formatting

on:
  push:
    branches:
      - fix/query-roles-truthful-fallback

permissions:
  contents: write

jobs:
  normalize-bounded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/query-roles-truthful-fallback
          fetch-depth: 0

      - name: Normalize only accepted query-roles continuation indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server.py")
          text = path.read_text(encoding="utf-8")
          marker = '@app.post("/query/roles"'
          if text.count(marker) != 1:
              raise SystemExit("unexpected /query/roles endpoint count")
          start = text.index(marker)
          end = text.find("\n@app.", start + len(marker))
          if end == -1:
              raise SystemExit("could not find endpoint boundary")
          block = text[start:end]

          wrong_reason = """        synthesis = await bm.reason(
          query=req.query,
          roles=role_list,
          llm_config=_env_llm_config(),
      )"""
          correct_reason = """        synthesis = await bm.reason(
              query=req.query,
              roles=role_list,
              llm_config=_env_llm_config(),
          )"""
          wrong_llm = """            llm_answer=(
          synthesis.response if synthesis.all_branches_used_llm else None
      ),"""
          correct_llm = """            llm_answer=(
              synthesis.response if synthesis.all_branches_used_llm else None
          ),"""

          for wrong, correct, label in (
              (wrong_reason, correct_reason, "reason"),
              (wrong_llm, correct_llm, "llm_answer"),
          ):
              if wrong in block:
                  block = block.replace(wrong, correct, 1)
              elif correct not in block:
                  raise SystemExit(f"unexpected {label} form")

          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile server.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "server.py" || test -z "$changed"
          git diff -- server.py

      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- server.py; then
            echo "server.py already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "style(server): normalize query roles continuation indent"
          git push origin HEAD:fix/query-roles-truthful-fallback
