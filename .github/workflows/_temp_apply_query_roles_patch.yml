name: Temporary endpoint-scoped query-roles patch

on:
  push:
    branches:
      - fix/query-roles-truthful-fallback

permissions:
  contents: write

jobs:
  apply-bounded-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/query-roles-truthful-fallback
          fetch-depth: 0

      - name: Apply exact endpoint-scoped patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("server.py")
          text = path.read_text(encoding="utf-8")
          marker = '@app.post("/query/roles"'
          if text.count(marker) != 1:
              raise SystemExit(f"expected one /query/roles endpoint, got {text.count(marker)}")

          start = text.index(marker)
          end = text.find("\n@app.", start + len(marker))
          if end == -1:
              raise SystemExit("could not find endpoint boundary")
          block = text[start:end]

          old_reason = "        synthesis = await bm.reason(query=req.query, roles=role_list)"
          new_reason = """        synthesis = await bm.reason(
              query=req.query,
              roles=role_list,
              llm_config=_env_llm_config(),
          )"""
          old_llm = "            llm_answer=synthesis.response,"
          new_llm = """            llm_answer=(
              synthesis.response if synthesis.all_branches_used_llm else None
          ),"""
          old_branches = '                "branches": [b.to_dict() for b in synthesis.branches],'
          new_branches = old_branches + '\n                "all_branches_used_llm": synthesis.all_branches_used_llm,'

          expected = ((old_reason, "reason call"), (old_llm, "llm_answer"), (old_branches, "branch lens"))
          if all(block.count(old) == 0 for old, _ in expected):
              if (
                  "llm_config=_env_llm_config()" in block
                  and "synthesis.all_branches_used_llm else None" in block
                  and '"all_branches_used_llm": synthesis.all_branches_used_llm' in block
              ):
                  raise SystemExit(0)
              raise SystemExit("endpoint is neither accepted-old nor accepted-new form")

          for old, label in expected:
              count = block.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label} inside endpoint, got {count}")

          block = block.replace(old_reason, new_reason)
          block = block.replace(old_llm, new_llm)
          block = block.replace(old_branches, new_branches)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile server.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "server.py"
          git diff -- server.py

      - name: Commit bounded server patch
        shell: bash
        run: |
          if git diff --quiet -- server.py; then
            echo "No server.py change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py
          git commit -m "fix(server): report query roles LLM provenance truthfully"
          git push origin HEAD:fix/query-roles-truthful-fallback
