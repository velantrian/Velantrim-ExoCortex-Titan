name: One-shot apply issue 151 test gate

on:
  push:
    branches:
      - agent/fix-audit-concurrency-test-gate

permissions:
  contents: write

jobs:
  apply-and-stress:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-concurrency-test-gate
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: pip install -e ".[dev]"

      - name: Apply exact gate correction
        run: |
          python scripts/apply_issue_151_patch.py
          python -m py_compile tests/test_audit_chain_transition_ledger.py

      - name: Stress the corrected concurrency gate
        run: |
          for i in $(seq 1 20); do
            python -m pytest -q \
              tests/test_audit_chain_transition_ledger.py::TestConcurrentWritersNoForkNoDuplicate::test_two_real_threads_same_fact_exactly_one_event_each_no_fork
          done

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-issue-151-patch.yml
          rm scripts/apply_issue_151_patch.py

      - name: Commit test-only reliability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_audit_chain_transition_ledger.py \
                  .github/workflows/apply-issue-151-patch.yml \
                  scripts/apply_issue_151_patch.py
          git commit -m "test(audit): make concurrent CAS gate deterministic"
          git push origin HEAD:agent/fix-audit-concurrency-test-gate
