name: temp-goal-subject-binding-apply

on:
  push:
    branches: [feat/continuity-goal-subject-binding]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-goal-subject-binding
          fetch-depth: 0
      - name: Reuse reviewed patch payload
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temp-goal-subject-binding-retry.yml').read_text()
          start = source.index('      - name: Apply subject-binding patch\n')
          start = source.index('        run: |\n', start) + len('        run: |\n')
          end = source.index('      - name: Validate focused tests\n', start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/apply-subject-binding.sh').write_text(script + '\n')
          PY
          bash /tmp/apply-subject-binding.sh
          rm -f .github/workflows/temp-goal-subject-binding-apply.yml
      - name: Commit code and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(continuity): bind goal projections to subjects"
          git push origin HEAD:feat/continuity-goal-subject-binding
