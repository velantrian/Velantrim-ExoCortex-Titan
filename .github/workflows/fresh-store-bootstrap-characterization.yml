name: Fresh-store bootstrap characterization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fresh-store-bootstrap-characterization.yml"
      - "scripts/diagnose_fresh_store_bootstrap.py"
      - "core/memory.py"
      - "core/version_store.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fresh-store-bootstrap-characterization.yml"
      - "scripts/diagnose_fresh_store_bootstrap.py"
      - "core/memory.py"
      - "core/version_store.py"

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/sync-python-deps
        with:
          extras: server dev parsers retrieval embeddings graph-lab
      - name: Characterize fresh-store bootstrap
        run: |
          mkdir -p artifacts
          python scripts/diagnose_fresh_store_bootstrap.py --contenders 25 --repetitions 20 --output artifacts/report.json | tee artifacts/report.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue347-py${{ matrix.python }}
          path: artifacts/
          retention-days: 14
