name: Debug MetaSupervisor budget test

on:
  pull_request:
    branches: [main]
    paths:
      - "core/memory_budget.py"
      - "tests/test_meta_supervisor_budget.py"
      - ".github/workflows/debug-meta-budget.yml"

jobs:
  focused-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: pip install -e ".[server,dev]"
      - name: Run focused test and capture output
        id: focused
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_meta_supervisor_budget.py -vv --tb=long > meta-budget-debug.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat meta-budget-debug.txt
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-budget-debug
          path: meta-budget-debug.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test result
        if: steps.focused.outputs.exit_code != '0'
        run: exit 1
