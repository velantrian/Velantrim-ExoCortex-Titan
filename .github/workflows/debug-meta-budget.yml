name: Debug full-suite failure

on:
  pull_request:
    branches: [main]
    paths:
      - "core/memory_budget.py"
      - "tests/test_meta_supervisor_budget.py"
      - ".github/workflows/debug-meta-budget.yml"

jobs:
  full-suite-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CI dependencies
        run: pip install -e ".[server,dev,parsers,retrieval,embeddings,graph-lab]"
      - name: Run full suite and capture first failure
        id: suite
        shell: bash
        env:
          PYTHONUNBUFFERED: 1
          VELANTRIM_DB_PATH: "${{ runner.temp }}/velantrim-debug.db"
          VELANTRIM_NGRAM_DB: "${{ runner.temp }}/velantrim-ngram-debug.db"
          VELANTRIM_API_KEY: "ci-test-key"
        run: |
          set +e
          python -m pytest tests/ -v --tb=long --timeout=300 -x > full-suite-debug.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          tail -n 250 full-suite-debug.txt
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-debug
          path: full-suite-debug.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve suite result
        if: steps.suite.outputs.exit_code != '0'
        run: exit 1
