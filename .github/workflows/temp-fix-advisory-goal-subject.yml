name: temp-fix-advisory-goal-subject

on:
  push:
    branches:
      - feat/continuity-goal-subject-binding

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-goal-subject-binding
          fetch-depth: 0
      - name: Patch fixture
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('tests/test_continuity_advisory_shadow.py'); s=p.read_text(); old='        policy_version=GOAL_OPEN_LOOP_POLICY_VERSION,\\n        goal_ref=\"goal-1\",\\n'; new='        policy_version=GOAL_OPEN_LOOP_POLICY_VERSION,\\n        user_id=\"user:advisory-fixture\",\\n        goal_ref=\"goal-1\",\\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          rm .github/workflows/temp-fix-advisory-goal-subject.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(continuity): bind advisory goal fixture to subject"
          git push origin HEAD:feat/continuity-goal-subject-binding
