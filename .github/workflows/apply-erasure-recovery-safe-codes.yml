name: One-shot harden erasure recovery error codes

on:
  push:
    branches:
      - agent/erasure-startup-recovery-contracts

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/erasure-startup-recovery-contracts
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: pip install -e ".[dev]"

      - name: Apply exact safe-code patch
        run: |
          python scripts/apply_erasure_recovery_safe_codes.py
          python -m py_compile core/erasure_startup_recovery.py tests/test_erasure_startup_recovery.py

      - name: Run focused recovery contract tests
        run: python -m pytest -q tests/test_erasure_startup_recovery.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-erasure-recovery-safe-codes.yml
          rm scripts/apply_erasure_recovery_safe_codes.py

      - name: Commit final contract hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/erasure_startup_recovery.py \
                  tests/test_erasure_startup_recovery.py \
                  docs/operations/erasure-startup-recovery-contract.md \
                  .github/workflows/apply-erasure-recovery-safe-codes.yml \
                  scripts/apply_erasure_recovery_safe_codes.py
          git commit -m "fix(erasure): restrict recovery receipts to safe error codes"
          git push origin HEAD:agent/erasure-startup-recovery-contracts
