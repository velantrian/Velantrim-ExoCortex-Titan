name: Repository hygiene

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: repository-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tracked-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime/cache artifacts
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_tracked_artifacts.py | tee tracked-artifacts.txt
      - name: Upload forbidden artifact inventory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tracked-artifacts
          path: tracked-artifacts.txt
          if-no-files-found: error
          retention-days: 1
