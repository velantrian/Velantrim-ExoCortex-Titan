name: Repository hygiene

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tracked-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked runtime/cache artifacts
        run: python scripts/check_tracked_artifacts.py
