name: Temporary harden Continuity references

on:
  push:
    branches:
      - feat/continuity-trusted-signal-producer

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: "${{ !contains(github.event.head_commit.message, 'continuity-refs-hardened') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-trusted-signal-producer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply hardening patch and tests
        run: python scripts/temporary_harden_continuity_refs.py
      - name: Install and validate focused surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m ruff check core/continuity tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py
          python -m mypy core/continuity core/compute_controller.py --show-error-codes
          python -m pytest tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py
      - name: Commit tested hardening
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add core/continuity/observations.py core/continuity/signal_producer.py tests/test_continuity_observations.py
          git commit -m "fix(continuity): fail closed on malformed reference collections [continuity-refs-hardened]"
          git push origin HEAD:feat/continuity-trusted-signal-producer
