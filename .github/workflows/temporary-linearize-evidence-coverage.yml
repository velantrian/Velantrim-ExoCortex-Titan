name: Temporary linearize evidence coverage accumulation

on:
  push:
    branches:
      - feat/continuity-trusted-signal-producer

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: "${{ !contains(github.event.head_commit.message, 'coverage-accumulator-linearized') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-trusted-signal-producer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply bounded implementation refactor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("core/continuity/signal_producer.py")
          text = path.read_text(encoding="utf-8")
          old = "    by_scope: dict[str, tuple[ContinuitySignalObservation, ...]] = defaultdict(tuple)\n    for observation in sorted(group, key=lambda item: item.observation_id):\n        scope = _required_scope(observation.scope)\n        by_scope[scope] = by_scope[scope] + (observation,)"
          new = "    by_scope: dict[str, list[ContinuitySignalObservation]] = defaultdict(list)\n    for observation in sorted(group, key=lambda item: item.observation_id):\n        scope = _required_scope(observation.scope)\n        by_scope[scope].append(observation)"
          if text.count(old) != 1:
              raise SystemExit("expected one evidence-coverage accumulator")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install and validate
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m ruff check core/continuity tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py tests/test_continuity_signal_producer_review_regressions.py
          python -m mypy core/continuity core/compute_controller.py --show-error-codes
          python -m pytest tests/test_continuity_observations.py tests/test_continuity_signal_producer.py tests/test_continuity_producer_determinism.py tests/test_continuity_signal_producer_review_regressions.py
      - name: Commit tested refactor and remove workflow
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git add core/continuity/signal_producer.py
          git rm .github/workflows/temporary-linearize-evidence-coverage.yml
          git commit -m "perf(continuity): linearize evidence scope accumulation [coverage-accumulator-linearized]"
          git push origin HEAD:feat/continuity-trusted-signal-producer
