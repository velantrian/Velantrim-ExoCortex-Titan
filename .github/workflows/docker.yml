name: Docker — build and runtime hardening checks

on:
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "server.py"
      - "server_patch/**"
      - "scripts/apply_migrations.py"
      - "migrations/**"
      - "static/**"
      - "app/**"
      - "localmind/**"
      - "core/**"
      - "api/**"
      - "docs/CONSOLE_BROWSER_TEST.ru.md"
      - "docs/RESEARCH_MODE.ru.md"
      - "docs/EITI_PWA_RESEARCH_ROADMAP.ru.md"
      - "docs/seed/umwelt_mvp_seed.json"
      - "utils/**"
      - "config/profiles/**"
      - "config/exocortex-dev.env"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "server.py"
      - "server_patch/**"
      - "scripts/apply_migrations.py"
      - "migrations/**"
      - "static/**"
      - "app/**"
      - "localmind/**"
      - "core/**"
      - "api/**"
      - "docs/CONSOLE_BROWSER_TEST.ru.md"
      - "docs/RESEARCH_MODE.ru.md"
      - "docs/EITI_PWA_RESEARCH_ROADMAP.ru.md"
      - "docs/seed/umwelt_mvp_seed.json"
      - "utils/**"
      - "config/profiles/**"
      - "config/exocortex-dev.env"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".github/workflows/docker.yml"

jobs:
  docker-build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Prove .dockerignore/COPY hygiene: plant a synthetic secret that
      # would exist in a naive `COPY . .` build, then assert below that it
      # never makes it into the image. Never a real credential.
      - name: Plant synthetic canary secret
        id: canary
        run: |
          token="canary-$(date +%s)-${{ github.run_id }}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"
          echo "VELANTRIM_API_KEY=${token}" > .env
          echo "SUPER_SECRET=${token}" > config/leaked.env

      - name: Build image (no cache)
        run: |
          docker build --no-cache \
            --build-arg RUNTIME_EXTRAS=server \
            -t velantrim-titan:ci .

      - name: Import smoke test
        run: |
          # server.py enforces VELANTRIM_API_KEY at import time (module-level
          # guard, server.py:85), not only at request time, so importing it
          # needs a key present just like a real boot would.
          docker run --rm \
            -e VELANTRIM_API_KEY="ci-import-smoke-key" \
            velantrim-titan:ci python -c "import core; import server; print('import OK')"

      - name: Check utils/ (packaging regression) is importable and usable
        run: |
          # utils/ is a top-level module (not core*/api*) that
          # core/affordance_linker.py and core/living_context.py import as
          # utils.text_utils at runtime. It had no __init__.py and wasn't
          # in pyproject.toml's packages.find include list, so it was
          # silently absent from this wheel — ModuleNotFoundError the
          # moment affordance extraction actually ran in the container.
          docker run --rm \
            -e VELANTRIM_API_KEY="ci-import-smoke-key" \
            velantrim-titan:ci python -c "
from utils.text_utils import tokenize
from core.affordance_linker import AffordanceLinker
assert tokenize('Дерево растёт в лесу') == ['дерево', 'растёт', 'лесу']
r = AffordanceLinker().extract('fact-1', 'Дерево растёт в лесу')
assert r.fact_id == 'fact-1'
print('utils.text_utils + affordance_linker OK')
"

      - name: Confirm non-root UID
        run: |
          uid="$(docker run --rm velantrim-titan:ci id -u)"
          echo "container uid: ${uid}"
          if [ "${uid}" = "0" ]; then
            echo "::error::container runs as root (uid 0)"
            exit 1
          fi

      - name: Boot server and check /health
        run: |
          docker run -d --name velantrim-ci \
            -p 18000:8000 \
            -e VELANTRIM_API_KEY="ci-health-check-key" \
            -e VELANTRIM_ALLOW_OPEN=false \
            velantrim-titan:ci

          ok=""
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://localhost:18000/health > /tmp/health.json; then
              ok=1
              break
            fi
            sleep 1
          done

          echo "--- container logs ---"
          docker logs velantrim-ci || true

          if [ -z "${ok}" ]; then
            echo "::error::/health never became reachable"
            exit 1
          fi
          echo "--- /health response ---"
          cat /tmp/health.json

      - name: Check /console and its docs endpoints
        run: |
          # Regression coverage for the wheel-packaging bug fixed in this PR:
          # api/web_console.py used to resolve static/console/* and docs/*
          # relative to __file__, which pointed into site-packages once api/
          # was installed as a non-editable wheel — /console 404'd even
          # though the Dockerfile copies the assets to /app. VELANTRIM_APP_ROOT
          # (set in the Dockerfile) fixes that; these checks prove it holds
          # in the actual built image, not just in unit tests.
          fail=0

          console_body="$(curl --fail --silent --max-time 5 http://localhost:18000/console)" || {
            echo "::error::GET /console failed"
            fail=1
          }
          if [ "${fail}" -eq 0 ] && ! grep -q "VELANTRIM Titan — console" <<< "${console_body}"; then
            echo "::error::/console body is missing its expected <title> marker — served the wrong content or a stub"
            fail=1
          fi

          for path in /console/help /console/research-mode.md /console/research-roadmap.md; do
            if ! curl --fail --silent --max-time 5 "http://localhost:18000${path}" > /dev/null; then
              echo "::error::GET ${path} failed"
              fail=1
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            echo "--- container logs ---"
            docker logs velantrim-ci || true
            exit 1
          fi
          echo "/console and its docs endpoints all responded"

      - name: Stop server
        if: always()
        run: docker rm -f velantrim-ci || true

      - name: Boot with VELANTRIM_PROFILE and confirm the profile env loads
        run: |
          # Regression coverage: core/deployment_profiles.py resolved
          # config/profiles/*.env relative to __file__, which broke the
          # same way api/web_console.py's static/console/* did once core/
          # is installed as a non-editable wheel — server.py logs
          # "VELANTRIM_PROFILE=... не загружен" (server.py:81) and silently
          # continues without the profile's env, instead of failing loudly.
          docker run -d --name velantrim-ci-profile \
            -p 18001:8000 \
            -e VELANTRIM_API_KEY="ci-profile-check-key" \
            -e VELANTRIM_PROFILE="citizen" \
            velantrim-titan:ci

          ok=""
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://localhost:18001/health > /dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          logs="$(docker logs velantrim-ci-profile 2>&1)"
          docker rm -f velantrim-ci-profile || true

          if [ -z "${ok}" ]; then
            echo "::error::server with VELANTRIM_PROFILE=citizen never became healthy"
            echo "${logs}"
            exit 1
          fi
          if grep -q "не загружен" <<< "${logs}"; then
            echo "::error::VELANTRIM_PROFILE=citizen failed to load (config/profiles/citizen.env not found at runtime)"
            echo "${logs}"
            exit 1
          fi
          echo "VELANTRIM_PROFILE=citizen loaded without error"

      - name: Export image filesystem for content checks
        run: |
          cid="$(docker create velantrim-titan:ci)"
          docker export "$cid" -o image.tar
          docker rm "$cid"
          tar -tf image.tar > image_filelist.txt
          # Everything this project actually controls lives under app/
          # (WORKDIR /app). /opt/venv/** is vendored third-party package
          # content (e.g. setuptools ships its own bundled tests/ and
          # docs/ dirs) and must not be scanned for OUR project's
          # forbidden paths, or every build-tool's internal test suite
          # trips these checks.
          grep '^app/' image_filelist.txt > app_filelist.txt || true
          wc -l image_filelist.txt app_filelist.txt

      - name: Check forbidden paths are absent from the image
        run: |
          forbidden_patterns=(
            '(^|/)\.git($|/)'
            '(^|/)\.env$'
            '(^|/)\.env\.'
            '(^|/)\.coverage$'
            '(^|/)\.pytest_cache($|/)'
            '(^|/)\.ruff_cache($|/)'
            '(^|/)\.mypy_cache($|/)'
            '\.db$'
            '\.db-wal$'
            '\.db-shm$'
            'kb_graph\.json$'
            '(^|/)tests($|/)'
          )
          fail=0
          for pattern in "${forbidden_patterns[@]}"; do
            if grep -E "${pattern}" app_filelist.txt; then
              echo "::error::forbidden path matched pattern: ${pattern}"
              fail=1
            fi
          done
          # dev-only console scripts must not be installed in the default
          # (RUNTIME_EXTRAS=server) image — checked across the whole image,
          # since this is exactly where pip places them.
          for tool in pytest ruff mypy; do
            if grep -E "^opt/venv/bin/${tool}$" image_filelist.txt; then
              echo "::error::dev tool '${tool}' present in default runtime image"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "no forbidden paths found under app/, no dev tools in /opt/venv/bin"

      - name: Check canary secret content did not leak into the image
        run: |
          token="${{ steps.canary.outputs.token }}"
          if tar -xf image.tar -O 2>/dev/null | grep -q -- "${token}"; then
            echo "::error::synthetic canary secret leaked into image contents"
            exit 1
          fi
          echo "canary secret not found in image contents"

      - name: Check exactly the expected docs/ files are present under app/docs/
        run: |
          # docs/ is dockerignored except the files api/web_console.py and
          # core/umwelt_store.py actually serve/read at runtime — assert
          # both that these made it in AND that nothing else from docs/
          # (33MB, ~hundreds of files) did.
          expected_docs=(
            "app/docs/CONSOLE_BROWSER_TEST.ru.md"
            "app/docs/RESEARCH_MODE.ru.md"
            "app/docs/EITI_PWA_RESEARCH_ROADMAP.ru.md"
            "app/docs/seed/umwelt_mvp_seed.json"
          )
          # tar -tf lists directory entries themselves (trailing slash)
          # alongside the files inside them — exclude those so the
          # comparison is files-only.
          actual_docs="$(grep '^app/docs/' image_filelist.txt | grep -v '/$' | sort)"
          expected_sorted="$(printf '%s\n' "${expected_docs[@]}" | sort)"
          if [ "${actual_docs}" != "${expected_sorted}" ]; then
            echo "::error::app/docs/ contents don't match the expected file allowlist"
            echo "--- expected ---"
            echo "${expected_sorted}"
            echo "--- actual ---"
            echo "${actual_docs}"
            exit 1
          fi
          echo "app/docs/ contains exactly the expected files, nothing else"

      - name: Check exactly the expected config/ files are present under app/config/
        run: |
          # config/ is never bulk-copied — only the profile env files
          # core/deployment_profiles.py reads at runtime (VELANTRIM_PROFILE=...).
          expected_config=(
            "app/config/profiles/citizen.env"
            "app/config/profiles/cognitive.env"
            "app/config/profiles/company.env"
            "app/config/profiles/education.env"
            "app/config/profiles/personal.env"
            "app/config/profiles/research.env"
            "app/config/profiles/science.env"
            "app/config/exocortex-dev.env"
          )
          actual_config="$(grep '^app/config/' image_filelist.txt | grep -v '/$' | sort)"
          expected_sorted="$(printf '%s\n' "${expected_config[@]}" | sort)"
          if [ "${actual_config}" != "${expected_sorted}" ]; then
            echo "::error::app/config/ contents don't match the expected file allowlist"
            echo "--- expected ---"
            echo "${expected_sorted}"
            echo "--- actual ---"
            echo "${actual_config}"
            exit 1
          fi
          echo "app/config/ contains exactly the expected profile env files, nothing else"

      - name: Check required runtime assets are present
        run: |
          required_paths=(
            "app/server.py"
            "app/server_patch/export_endpoints.py"
            "app/scripts/apply_migrations.py"
            "app/migrations/012_crystal_memory.sql"
            "app/static/console/index.html"
            "app/docs/CONSOLE_BROWSER_TEST.ru.md"
            "app/docs/RESEARCH_MODE.ru.md"
            "app/docs/EITI_PWA_RESEARCH_ROADMAP.ru.md"
          )
          missing=0
          for p in "${required_paths[@]}"; do
            if ! grep -qx "${p}" image_filelist.txt; then
              echo "::error::expected runtime asset missing from image: ${p}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "--- filelist (app/ subset) ---"
            grep '^app/' image_filelist.txt
            exit 1
          fi
          echo "all required runtime assets present"

      - name: Check utils/ made it into the installed wheel (not just importable at runtime)
        run: |
          if ! grep -Eq "^opt/venv/lib/python3\.[0-9]+/site-packages/utils/text_utils\.py$" image_filelist.txt; then
            echo "::error::utils/text_utils.py missing from the installed wheel in /opt/venv"
            grep -E "site-packages/utils/" image_filelist.txt || echo "(no utils/ under site-packages at all)"
            exit 1
          fi
          echo "utils/ is part of the installed wheel"

      - name: Check default docker-compose files don't advertise GraphLab
        run: |
          # ENABLE_GRAPH_LAB needs the "graph-lab" build extra (networkx),
          # which RUNTIME_EXTRAS defaults to *not* installing. Static check
          # (no docker-compose run needed): the recommended compose files
          # must not hardcode ENABLE_GRAPH_LAB=1 — it has to come from an
          # override (${ENABLE_GRAPH_LAB:-0}) so the default stays honest.
          fail=0
          for f in docker-compose.yml docker-compose.dev.yml; do
            if grep -E '^\s*-\s*ENABLE_GRAPH_LAB=1\s*$' "${f}"; then
              echo "::error::${f} hardcodes ENABLE_GRAPH_LAB=1 but the default image has no networkx"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "docker-compose.yml / docker-compose.dev.yml default GraphLab off"

      - name: Clean up local secret fixtures
        if: always()
        run: rm -f .env config/leaked.env image.tar image_filelist.txt /tmp/health.json
