name: Diagnostic PR168 order-dependent exception

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-pr168-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/promotion-gateway-graduated-migration-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotion-gateway-graduated-migration-clean
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the authoritative CI dependency profile
        run: |
          pip install --upgrade pip
          pip install -e ".[server,dev,parsers,retrieval,embeddings,graph-lab]"

      - name: Instrument only the swallowed caller exception
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("core/promotion_policy.py")
          source = path.read_text(encoding="utf-8")
          old = (
              "        except Exception:  # noqa: BLE001\n"
              "            report.errors += 1\n"
          )
          new = (
              "        except Exception as exc:  # noqa: BLE001\n"
              "            raise RuntimeError(\n"
              "                f\"PR168_DIAGNOSTIC:{type(exc).__name__}:{exc}\"\n"
              "            ) from exc\n"
          )
          if source.count(old) != 1:
              raise RuntimeError(
                  f"expected one caller exception boundary, found {source.count(old)}"
              )
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Reproduce the authoritative test order and capture traceback
        env:
          PYTHONUNBUFFERED: 1
          VELANTRIM_DB_PATH: "${{ runner.temp }}/velantrim-ci.db"
          VELANTRIM_NGRAM_DB: "${{ runner.temp }}/velantrim-ngram-ci.db"
          VELANTRIM_API_KEY: "ci-test-key"
        run: |
          set +e
          python -m pytest tests/ -v --tb=long --timeout=300 -x > /tmp/pr168-order.log 2>&1
          status=$?
          set -e
          mkdir -p diagnostics
          python - "$status" <<'PY'
          from __future__ import annotations

          import sys
          from pathlib import Path

          status = int(sys.argv[1])
          lines = Path('/tmp/pr168-order.log').read_text(
              encoding='utf-8', errors='replace'
          ).splitlines()
          marker = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if 'PR168_DIAGNOSTIC:' in line
                  or '=================================== FAILURES' in line
              ),
              max(0, len(lines) - 240),
          )
          start = max(0, marker - 80)
          excerpt = lines[start:start + 320]
          Path('diagnostics/pr168-order-failure.txt').write_text(
              '\n'.join([
                  'PR168 order-dependent exception diagnostic',
                  f'PYTEST_EXIT={status}',
                  '---',
                  *excerpt,
                  '',
              ]),
              encoding='utf-8',
          )
          PY

      - name: Publish temporary diagnostic evidence only
        run: |
          git checkout -- core/promotion_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pr168-order-failure.txt
          git commit -m "chore(diagnostic): record PR168 order exception"
          git fetch origin agent/promotion-gateway-graduated-migration-clean
          git rebase origin/agent/promotion-gateway-graduated-migration-clean
          git push origin HEAD:agent/promotion-gateway-graduated-migration-clean
