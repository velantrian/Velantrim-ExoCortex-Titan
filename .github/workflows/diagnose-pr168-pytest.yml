name: Diagnostic PR168 gateway contract

on:
  pull_request:
    branches:
      - main

concurrency:
  group: diagnose-pr168-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/promotion-gateway-graduated-migration-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promotion-gateway-graduated-migration-clean
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the authoritative CI dependency profile
        run: |
          pip install --upgrade pip
          pip install -e ".[server,dev,parsers,retrieval,embeddings,graph-lab]"

      - name: Capture the exact gateway contract exception
        env:
          PYTHONUNBUFFERED: 1
          VELANTRIM_API_KEY: "ci-test-key"
        run: |
          mkdir -p diagnostics
          python - <<'PY'
          from __future__ import annotations

          import tempfile
          from pathlib import Path

          from core.memory import SQLiteGraphStore
          from core.promotion_gateway import PromotionGateway, PromotionRequest
          from core.promotion_policy import PromotionConfig, run_graduated_promotion
          from core.truth_gate import CognitiveMode

          output: list[str] = ["PR168 gateway contract diagnostic", "---"]
          with tempfile.TemporaryDirectory() as directory:
              store = SQLiteGraphStore(db_path=str(Path(directory) / "gateway.db"))
              store.store_fact({
                  "fact_id": "t1",
                  "claim": "A trusted seed axiom about the domain",
                  "source": "domain_seed",
                  "confidence": 0.9,
              })
              cfg = PromotionConfig(validate_min_age_s=0)
              run_graduated_promotion(store, cfg=cfg)
              run_graduated_promotion(store, cfg=cfg)

              raw = store.validate_and_promote(
                  "t1",
                  by="graduated_promotion",
                  mode=CognitiveMode.BALANCED,
              )
              output.extend([
                  f"raw.passed={raw.passed!r}",
                  f"raw.reason={raw.reason!r}",
                  f"raw.by={raw.by!r}",
                  f"raw.mode={raw.mode!r}",
                  f"raw.confidence={raw.confidence!r}:{type(raw.confidence).__name__}",
                  f"raw.evidence_count={raw.evidence_count!r}:{type(raw.evidence_count).__name__}",
                  f"raw.contradictions={raw.contradictions!r}:{type(raw.contradictions).__name__}",
                  f"raw.checked_at={raw.checked_at!r}:{type(raw.checked_at).__name__}",
              ])
              try:
                  outcome = PromotionGateway(store).promote(
                      PromotionRequest(
                          fact_id="t1",
                          requested_by="graduated_promotion",
                      )
                  )
              except Exception as exc:
                  output.extend([
                      f"gateway.exception_type={type(exc).__name__}",
                      f"gateway.exception={str(exc)!r}",
                  ])
              else:
                  output.extend([
                      "gateway.exception_type=None",
                      f"gateway.passed={outcome.receipt.passed!r}",
                      f"gateway.reason={outcome.receipt.reason_code!r}",
                      f"gateway.requested_by={outcome.receipt.requested_by!r}",
                      f"gateway.decided_by={outcome.receipt.decided_by!r}",
                  ])

          Path("diagnostics/pr168-gateway-contract.txt").write_text(
              "\n".join(output) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish temporary diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pr168-gateway-contract.txt
          git commit -m "chore(diagnostic): record PR168 gateway contract"
          git fetch origin agent/promotion-gateway-graduated-migration-clean
          git rebase origin/agent/promotion-gateway-graduated-migration-clean
          git push origin HEAD:agent/promotion-gateway-graduated-migration-clean
