name: Temporary apply final Continuity audit fixes

on:
  push:
    branches:
      - feat/continuity-trusted-signal-producer

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    if: "${{ !contains(github.event.head_commit.message, 'continuity-audit-fixes-complete') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuity-trusted-signal-producer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply bounded production fixes and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          producer = Path("core/continuity/signal_producer.py")
          text = producer.read_text(encoding="utf-8")

          old_boolean = '''def _aggregate_boolean_or(
              group: tuple[ContinuitySignalObservation, ...],
              signal_type: ContinuitySignalType,
          ) -> tuple[bool, ContinuitySignalProvenance]:
              true_observations = tuple(
                  observation for observation in group if observation.value is True
              )
              value = bool(true_observations)
              provenance = ContinuitySignalProvenance(
                  signal_type=signal_type,
                  observation_ids=tuple(
                      observation.observation_id for observation in true_observations
                  ),
                  evidence_refs=_refs_union(true_observations),
                  producers=_producers(true_observations),
                  confidence=_min_confidence(true_observations),
                  rule=(
                      "trusted_true_observation_or"
                      if true_observations
                      else "no_trusted_true_observations"
                  ),
                  value=value,
              )
              return value, provenance
          '''
          new_boolean = '''def _aggregate_boolean_or(
              group: tuple[ContinuitySignalObservation, ...],
              signal_type: ContinuitySignalType,
          ) -> tuple[bool, ContinuitySignalProvenance]:
              true_observations = tuple(
                  observation for observation in group if observation.value is True
              )
              value = bool(true_observations)
              if true_observations:
                  rule = "trusted_true_observation_or"
              elif group:
                  rule = "trusted_false_observations_only"
              else:
                  rule = "no_trusted_observations"
              provenance = ContinuitySignalProvenance(
                  signal_type=signal_type,
                  observation_ids=tuple(
                      observation.observation_id for observation in group
                  ),
                  evidence_refs=_refs_union(group),
                  producers=_producers(group),
                  confidence=_min_confidence(group),
                  rule=rule,
                  value=value,
              )
              return value, provenance
          '''

          old_availability = '''    else:
                  value = False
                  rule = (
                      "no_trusted_true_observations"
                      if not true_observations
                      else "insufficient_confirmations"
                  )
                  contributing = true_observations
          '''
          new_availability = '''    else:
                  value = False
                  if false_observations:
                      rule = "trusted_negative_observations_fail_conservative"
                      contributing = false_observations
                  elif true_observations:
                      rule = "insufficient_confirmations"
                      contributing = true_observations
                  else:
                      rule = "no_trusted_observations"
                      contributing = ()
          '''

          for old, new, label in (
              (old_boolean, new_boolean, "boolean OR aggregation"),
              (old_availability, new_availability, "availability negative provenance"),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label} target")
              text = text.replace(old, new, 1)
          producer.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_continuity_signal_producer_review_regressions.py")
          test_path.write_text('''"""Regression tests for independent review findings on Continuity signals."""
          from __future__ import annotations

          from datetime import UTC, datetime
          from typing import Any, cast

          import pytest

          from core.continuity import (
              ContinuitySignalObservation,
              ContinuitySignalObservationError,
              ContinuitySignalPolicy,
              ContinuitySignalType,
              produce_continuity_compute_signals,
          )

          _NOW = datetime(2026, 8, 6, 5, 0, tzinfo=UTC)


          def _observation(
              signal_type: ContinuitySignalType,
              value: object,
              *,
              producer: str = "trusted-a",
              source_id: str = "source-1",
              evidence_ref: str = "evidence-1",
              confidence: float = 0.9,
          ) -> ContinuitySignalObservation:
              return ContinuitySignalObservation.create(
                  signal_type=signal_type,
                  value=value,
                  confidence=confidence,
                  producer=producer,
                  source_type="typed-test",
                  source_id=source_id,
                  observed_at=_NOW,
                  evidence_refs=(evidence_ref,),
                  reason_codes=("review-regression",),
              )


          def _policy(*, confirmations: int = 2) -> ContinuitySignalPolicy:
              return ContinuitySignalPolicy.create(
                  trusted_producers=("trusted-a", "trusted-b"),
                  allowed_source_types=("typed-test",),
                  minimum_confidence=0.5,
                  require_evidence_refs=True,
                  minimum_confirmations=confirmations,
                  max_contradiction_count=10,
              )


          def _provenance(result: object, signal_type: ContinuitySignalType):
              provenance = getattr(result, "provenance")
              return next(item for item in provenance if item.signal_type is signal_type)


          @pytest.mark.parametrize(
              ("field", "value"),
              [
                  ("evidence_refs", "evidence-1"),
                  ("evidence_refs", cast(Any, b"evidence-1")),
                  ("evidence_refs", cast(Any, 123)),
                  ("reason_codes", "review-regression"),
                  ("reason_codes", cast(Any, b"review-regression")),
                  ("reason_codes", cast(Any, 123)),
              ],
          )
          def test_observation_rejects_scalar_reference_collections(
              field: str, value: object
          ) -> None:
              kwargs: dict[str, object] = {
                  "signal_type": ContinuitySignalType.CONTEXT_DEGRADED,
                  "value": True,
                  "confidence": 0.9,
                  "producer": "trusted-a",
                  "source_type": "typed-test",
                  "source_id": "source-1",
                  "observed_at": _NOW,
                  "evidence_refs": ("evidence-1",),
                  "reason_codes": ("review-regression",),
              }
              kwargs[field] = value
              with pytest.raises(ContinuitySignalObservationError):
                  ContinuitySignalObservation.create(**cast(Any, kwargs))


          def test_observation_accepts_one_shot_reference_iterables() -> None:
              observation = ContinuitySignalObservation.create(
                  signal_type=ContinuitySignalType.CONTEXT_DEGRADED,
                  value=True,
                  confidence=0.9,
                  producer="trusted-a",
                  source_type="typed-test",
                  source_id="source-1",
                  observed_at=_NOW,
                  evidence_refs=(value for value in ("z", "a")),
                  reason_codes=(value for value in ("r2", "r1")),
              )
              assert observation.evidence_refs == ("a", "z")
              assert observation.reason_codes == ("r1", "r2")


          def test_false_only_warning_retains_complete_provenance() -> None:
              observation = _observation(
                  ContinuitySignalType.CONTEXT_DEGRADED,
                  False,
                  evidence_ref="evidence-false",
                  confidence=0.8,
              )
              result = produce_continuity_compute_signals(
                  [observation], policy=_policy()
              )
              item = _provenance(result, ContinuitySignalType.CONTEXT_DEGRADED)
              assert result.signals.context_degraded is False
              assert item.observation_ids == (observation.observation_id,)
              assert item.producers == ("trusted-a",)
              assert item.evidence_refs == ("evidence-false",)
              assert item.confidence == 0.8
              assert item.rule == "trusted_false_observations_only"


          def test_mixed_warning_true_wins_without_losing_negative_provenance() -> None:
              positive = _observation(
                  ContinuitySignalType.IMPORTANT_CLAIM,
                  True,
                  producer="trusted-a",
                  source_id="positive",
                  evidence_ref="evidence-positive",
              )
              negative = _observation(
                  ContinuitySignalType.IMPORTANT_CLAIM,
                  False,
                  producer="trusted-b",
                  source_id="negative",
                  evidence_ref="evidence-negative",
                  confidence=0.7,
              )
              result = produce_continuity_compute_signals(
                  [positive, negative], policy=_policy()
              )
              item = _provenance(result, ContinuitySignalType.IMPORTANT_CLAIM)
              assert result.signals.important_claim is True
              assert item.observation_ids == tuple(
                  sorted((positive.observation_id, negative.observation_id))
              )
              assert item.producers == ("trusted-a", "trusted-b")
              assert item.evidence_refs == (
                  "evidence-negative",
                  "evidence-positive",
              )
              assert item.confidence == 0.7
              assert item.rule == "trusted_true_observation_or"


          def test_false_only_availability_retains_negative_provenance() -> None:
              negative = _observation(
                  ContinuitySignalType.CONTINUITY_AVAILABLE,
                  False,
                  producer="trusted-b",
                  source_id="negative-availability",
                  evidence_ref="evidence-unavailable",
                  confidence=0.75,
              )
              result = produce_continuity_compute_signals(
                  [negative], policy=_policy()
              )
              item = _provenance(
                  result, ContinuitySignalType.CONTINUITY_AVAILABLE
              )
              assert result.signals.continuity_available is False
              assert item.observation_ids == (negative.observation_id,)
              assert item.producers == ("trusted-b",)
              assert item.evidence_refs == ("evidence-unavailable",)
              assert item.confidence == 0.75
              assert item.rule == "trusted_negative_observations_fail_conservative"


          def test_empty_availability_has_empty_default_provenance() -> None:
              result = produce_continuity_compute_signals([], policy=_policy())
              item = _provenance(
                  result, ContinuitySignalType.CONTINUITY_AVAILABLE
              )
              assert result.signals.continuity_available is False
              assert item.observation_ids == ()
              assert item.producers == ()
              assert item.evidence_refs == ()
              assert item.confidence == 0.0
              assert item.rule == "no_trusted_observations"
          ''', encoding="utf-8")
          PY
      - name: Install and run focused validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m ruff check \
            core/continuity/observations.py \
            core/continuity/signal_producer.py \
            tests/test_continuity_signal_producer_review_regressions.py
          python -m mypy core/continuity core/compute_controller.py --show-error-codes
          python -m pytest \
            tests/test_continuity_observations.py \
            tests/test_continuity_signal_producer.py \
            tests/test_continuity_producer_determinism.py \
            tests/test_continuity_signal_producer_review_regressions.py
      - name: Remove temporary workflow and commit tested fixes
        run: |
          git config user.name "Velantrim GitHub Actions"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temporary-fix-continuity-review.yml
          git add \
            core/continuity/observations.py \
            core/continuity/signal_producer.py \
            tests/test_continuity_signal_producer_review_regressions.py
          git commit -m "fix(continuity): preserve negative signal provenance [continuity-audit-fixes-complete]"
          git push origin HEAD:feat/continuity-trusted-signal-producer
