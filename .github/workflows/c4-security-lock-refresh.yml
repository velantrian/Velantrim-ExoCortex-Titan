name: C4 temporary security lock refresh

on:
  push:
    branches:
      - agent/issue-52-dependency-audit

permissions:
  contents: write

jobs:
  refresh-security-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install repository uv version
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.3

      - name: Resolve audited dependency fixes only
        run: |
          set -euo pipefail
          uv lock \
            --upgrade-package pillow \
            --upgrade-package pypdf2 \
            --upgrade-package pytest \
            --upgrade-package setuptools \
            --upgrade-package starlette \
            --upgrade-package torch
          changed="$(git diff --name-only)"
          if [ "${changed}" != "uv.lock" ]; then
            echo "::error::security lock refresh changed unexpected files: ${changed}"
            exit 1
          fi
          uv lock --check

      - name: Commit generated lock to bounded branch
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "::error::expected uv.lock to change after audited dependency remediation"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "build: refresh lock for audited dependency fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
