name: One-shot SQLite busy-timeout boundary

on:
  pull_request:
    branches:
      - main

concurrency:
  group: sqlite-busy-timeout-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-test:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.head_ref == 'agent/sqlite-busy-timeout-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sqlite-busy-timeout-boundary
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev]"

      - name: Apply exact busy-timeout patch
        run: |
          python scripts/apply_sqlite_busy_timeout_boundary.py
          python -m py_compile core/memory.py tests/test_sqlite_busy_timeout.py

      - name: Run focused timeout and resilience suites
        run: |
          python -m pytest -q \
            tests/test_sqlite_busy_timeout.py \
            tests/test_sqlite_store_resilience.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-sqlite-busy-timeout-boundary.yml
          rm scripts/apply_sqlite_busy_timeout_boundary.py

      - name: Commit final busy-timeout boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            core/memory.py \
            tests/test_sqlite_busy_timeout.py \
            docs/adr/ADR-2026-08-03-sqlite-busy-timeout-boundary.md \
            .github/workflows/apply-sqlite-busy-timeout-boundary.yml \
            scripts/apply_sqlite_busy_timeout_boundary.py
          git commit -m "feat(storage): bound SQLite busy timeout"
          git fetch origin agent/sqlite-busy-timeout-boundary
          git rebase origin/agent/sqlite-busy-timeout-boundary
          git push origin HEAD:agent/sqlite-busy-timeout-boundary
