name: One-shot apply erasure startup server wiring

on:
  push:
    branches:
      - agent/erasure-startup-server-wiring

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/erasure-startup-server-wiring
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused dependencies
        run: pip install -e ".[dev,embeddings,retrieval]"

      - name: Apply exact server patch
        run: |
          python scripts/apply_erasure_startup_server_wiring.py
          python -m py_compile server.py core/erasure_startup_runtime.py core/erasure_startup_runner.py

      - name: Run focused recovery wiring tests
        env:
          VELANTRIM_ALLOW_OPEN: "true"
        run: |
          python -m pytest -q \
            tests/test_erasure_startup_runner.py \
            tests/test_erasure_startup_runtime.py \
            tests/test_erasure_startup_server_wiring.py

      - name: Remove one-shot machinery
        run: |
          rm .github/workflows/apply-erasure-startup-server-wiring.yml
          rm scripts/apply_erasure_startup_server_wiring.py

      - name: Commit final startup wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.py \
                  tests/test_erasure_startup_server_wiring.py \
                  docs/operations/erasure-startup-server-wiring.md \
                  .github/workflows/apply-erasure-startup-server-wiring.yml \
                  scripts/apply_erasure_startup_server_wiring.py
          git commit -m "feat(erasure): wire bounded startup recovery"
          git push origin HEAD:agent/erasure-startup-server-wiring
