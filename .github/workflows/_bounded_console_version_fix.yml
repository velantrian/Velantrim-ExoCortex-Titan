name: Bounded console version branding fix

on:
  push:
    branches:
      - fix/console-version-branding
    paths:
      - .github/workflows/_bounded_console_version_fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/console-version-branding
          fetch-depth: 0
      - name: Apply exact bounded replacements and regression guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('static/console/index.html')
          de_path = Path('scripts/_inject_de.js')
          test_path = Path('tests/test_console_version_branding.py')

          index = index_path.read_text(encoding='utf-8')
          de = de_path.read_text(encoding='utf-8')

          replacements = [
              ('V8.7 · память + LLM · настройте API и общайтесь в чате', 'V9.0 · память + LLM · настройте API и общайтесь в чате', 'index RU', index),
              ('V8.7 · memory + LLM · configure API and chat', 'V9.0 · memory + LLM · configure API and chat', 'index EN', index),
              ('V8.7 · Speicher + LLM · API einrichten und chatten', 'V9.0 · Speicher + LLM · API einrichten und chatten', 'DE source', de),
          ]
          for old, _new, label, text in replacements:
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'{label}: expected at least 1 active stale target, found {count}')
              print(f'{label}: replacing {count} active stale target(s)')

          index = index.replace(replacements[0][0], replacements[0][1]).replace(replacements[1][0], replacements[1][1])
          de = de.replace(replacements[2][0], replacements[2][1])
          index_path.write_text(index, encoding='utf-8')
          de_path.write_text(de, encoding='utf-8')

          test_path.write_text('''from __future__ import annotations\n\nimport re\nfrom pathlib import Path\n\n\nREPO_ROOT = Path(__file__).resolve().parents[1]\nPYPROJECT = REPO_ROOT / "pyproject.toml"\nCONSOLE = REPO_ROOT / "static/console/index.html"\nDE_SOURCE = REPO_ROOT / "scripts/_inject_de.js"\n\n\ndef _display_version() -> str:\n    text = PYPROJECT.read_text(encoding="utf-8")\n    match = re.search(r'^version\\s*=\\s*"(\\d+)\\.(\\d+)\\.[^\"]+"', text, re.MULTILINE)\n    assert match is not None, "project version must remain declared in pyproject.toml"\n    return f"V{match.group(1)}.{match.group(2)}"\n\n\ndef test_active_console_subtitles_use_current_project_version() -> None:\n    display_version = _display_version()\n    console = CONSOLE.read_text(encoding="utf-8")\n    de_source = DE_SOURCE.read_text(encoding="utf-8")\n\n    assert "V8.7 · память + LLM" not in console\n    assert "V8.7 · memory + LLM" not in console\n    assert "V8.7 · Speicher + LLM" not in de_source\n\n    assert f"{display_version} · память + LLM" in console\n    assert f"{display_version} · memory + LLM" in console\n    assert f"{display_version} · Speicher + LLM" in de_source\n''', encoding='utf-8')

          assert 'V8.7 · память + LLM' not in index
          assert 'V8.7 · memory + LLM' not in index
          assert 'V8.7 · Speicher + LLM' not in de
          assert 'V9.0 · память + LLM' in index
          assert 'V9.0 · memory + LLM' in index
          assert 'V9.0 · Speicher + LLM' in de
          PY
      - name: Remove bounded staging workflow from final branch diff
        run: rm .github/workflows/_bounded_console_version_fix.yml
      - name: Commit bounded fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/console/index.html scripts/_inject_de.js tests/test_console_version_branding.py .github/workflows/_bounded_console_version_fix.yml
          git diff --cached --check
          git commit -m "fix(console): align visible version branding"
          git push origin HEAD:fix/console-version-branding
