name: C5 temporary Docker SBOM patcher

on:
  push:
    branches:
      - agent/issue-52-container-sbom

permissions:
  contents: write

jobs:
  patch-c5:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Patch Docker SBOM evidence contract
        run: |
          set -euo pipefail
          python scripts/c5_patch_temp.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/docker.yml' 'scripts/check_pr_merge_evidence.py' | sort)"
          if [ "${changed}" != "${expected}" ]; then
            echo "::error::C5 patcher changed unexpected files"
            echo "${changed}"
            exit 1
          fi

      - name: Commit bounded patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/docker.yml scripts/check_pr_merge_evidence.py
          git commit -m "build: generate final runtime container SBOM"
          git push origin "HEAD:${GITHUB_REF_NAME}"
