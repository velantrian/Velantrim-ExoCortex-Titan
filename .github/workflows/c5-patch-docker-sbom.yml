name: C5 temporary Docker SBOM patch exporter

on:
  push:
    branches:
      - agent/issue-52-container-sbom

permissions:
  contents: read

jobs:
  export-c5-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate and verify bounded patch
        run: |
          set -euo pipefail
          python scripts/c5_patch_temp.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/docker.yml' 'scripts/check_pr_merge_evidence.py' | sort)"
          if [ "${changed}" != "${expected}" ]; then
            echo "::error::C5 patcher changed unexpected files"
            echo "${changed}"
            exit 1
          fi

      - name: Export exact patched contents for connector write
        run: |
          set -euo pipefail
          echo '---DOCKER_YML_BASE64_BEGIN---'
          base64 -w0 .github/workflows/docker.yml
          echo
          echo '---DOCKER_YML_BASE64_END---'
          echo '---MERGE_EVIDENCE_BASE64_BEGIN---'
          base64 -w0 scripts/check_pr_merge_evidence.py
          echo
          echo '---MERGE_EVIDENCE_BASE64_END---'
