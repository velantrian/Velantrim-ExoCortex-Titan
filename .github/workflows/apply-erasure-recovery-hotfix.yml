name: Apply erasure recovery single-winner hotfix

on:
  push:
    branches:
      - fix/erasure-recovery-single-winner-reporting

permissions:
  contents: write

concurrency:
  group: apply-erasure-recovery-single-winner-hotfix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/erasure-recovery-single-winner-reporting
          fetch-depth: 0

      - name: Apply exact source and regression-test patch
        run: python scripts/apply_erasure_recovery_hotfix_once.py

      - name: Remove one-shot workflow and helper
        run: |
          rm .github/workflows/apply-erasure-recovery-hotfix.yml
          rm scripts/apply_erasure_recovery_hotfix_once.py

      - name: Commit patched source and test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(erasure): report only claimed recovery batches"
          git push origin HEAD:fix/erasure-recovery-single-winner-reporting
