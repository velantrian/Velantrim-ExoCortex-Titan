version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 2
    groups:
      uv-lock-refresh:
        patterns:
          - "*"
