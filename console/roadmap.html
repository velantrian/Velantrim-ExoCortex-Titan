<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Velantrim Roadmap v8.17.9</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0a1120;
      --panel-open: #0d1828;
      --head-grad-a: #0d1421;
      --head-grad-b: #111927;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e0e8f0;
      --muted: #9ba8bc;
      --soft: #5a6a80;
      --accent: #4ecdc4;
      --p0: #ff4444;
      --p1: #ff8800;
      --p2: #f0c040;
      --p3: #40c080;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(circle at 20% 0, rgba(78, 205, 196, 0.08), transparent 42%), var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .header {
      background: linear-gradient(135deg, var(--head-grad-a), var(--head-grad-b));
      border-bottom: 1px solid rgba(78, 205, 196, 0.15);
      padding: 28px 0 20px;
    }

    .kicker {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 0.2em;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      color: #e8e8e8;
    }

    .sub {
      font-size: 11px;
      color: var(--soft);
      margin: 0 0 18px;
    }

    .prio-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .prio-pill {
      border-radius: 8px;
      padding: 6px 12px;
      border: 1px solid transparent;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s ease, transform 0.15s ease;
      user-select: none;
    }

    .prio-pill:hover { transform: translateY(-1px); }

    .prio-pill.is-dim { opacity: 0.45; }

    .count {
      border-radius: 4px;
      padding: 1px 7px;
      font-weight: 700;
      font-size: 10px;
      color: #000;
      background: currentColor;
    }

    .filters {
      background: var(--head-grad-a);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 0;
      overflow-x: auto;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      min-width: fit-content;
    }

    .tag-btn {
      background: transparent;
      color: var(--soft);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      padding: 4px 10px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    .tag-btn.active {
      color: #070b14;
      border-color: var(--accent);
      background: var(--accent);
      font-weight: 700;
    }

    .meta {
      font-size: 10px;
      color: var(--soft);
      margin: 14px 0;
    }

    .task {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-left: 3px solid transparent;
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .task.open {
      background: var(--panel-open);
    }

    .task-head {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      padding: 12px 14px;
    }

    .task-id {
      color: var(--soft);
      font-size: 10px;
      min-width: 30px;
    }

    .task-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      flex: 1;
      min-width: 150px;
    }

    .task-tag {
      background: rgba(78, 205, 196, 0.1);
      color: var(--accent);
      font-size: 9px;
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .task-effort, .arrow {
      color: var(--soft);
      font-size: 10px;
      white-space: nowrap;
    }

    .arrow {
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .task.open .arrow {
      transform: rotate(180deg);
    }

    .task-body {
      display: none;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding: 6px 14px 18px;
    }

    .task.open .task-body {
      display: block;
    }

    .sec-label {
      font-size: 9px;
      color: var(--accent);
      letter-spacing: 0.15em;
      margin: 12px 0 6px;
      text-transform: uppercase;
    }

    .why {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.65;
    }

    .what-item {
      display: flex;
      gap: 7px;
      margin-bottom: 6px;
      align-items: flex-start;
      font-size: 11px;
      color: #c8d8e8;
      line-height: 1.6;
    }

    .what-arrow {
      margin-top: 1px;
      font-size: 11px;
      flex-shrink: 0;
    }

    .meta-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .box {
      flex: 1;
      min-width: 210px;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 10px;
      line-height: 1.5;
    }

    .box.from {
      background: rgba(201, 169, 110, 0.08);
      border: 1px solid rgba(201, 169, 110, 0.2);
      color: var(--muted);
    }

    .box.closes {
      background: rgba(78, 205, 196, 0.06);
      border: 1px solid rgba(78, 205, 196, 0.15);
      color: var(--muted);
    }

    .label {
      font-weight: 700;
      margin-right: 4px;
    }

    .hint {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(78, 205, 196, 0.15);
      background: rgba(78, 205, 196, 0.05);
      color: #c7f0ea;
      font-size: 10px;
      line-height: 1.55;
    }
  </style>
</head>

      }
    ];

    const tags = ["All", "Security", "Memory", "Retrieval", "Architecture", "Testing", "Verifiability", "Product", "Benchmark", "Bug", "Performance"];
    const priorities = ["P0", "P1", "P2", "P3"];
    const pc = {
      P0: { bg: "#ff4444", label: "КРИТИЧНО" },
      P1: { bg: "#ff8800", label: "ВАЖНО" },
      P2: { bg: "#f0c040", label: "НУЖНО" },
      P3: { bg: "#40c080", label: "УЛУЧШЕНИЕ" }
    };

    let tagF = "All";
    let prioF = "All";
    let openTask = null;

    function visibleTasks() {
      return tasks.filter(function (t) {
        return (tagF === "All" || t.tag === tagF) && (prioF === "All" || t.priority === prioF);
      });
    }

    function renderPriorityPills() {
      const root = document.getElementById("prio-grid");
      root.innerHTML = "";
      priorities.forEach(function (p) {
        const cfg = pc[p];
        const count = tasks.filter(function (t) { return t.priority === p; }).length;
        const active = prioF === p || prioF === "All";

        const pill = document.createElement("div");
        pill.className = "prio-pill" + (active ? "" : " is-dim");
        pill.style.background = cfg.bg + "22";
        pill.style.borderColor = cfg.bg + "55";
        pill.style.color = cfg.bg;
        pill.setAttribute("role", "button");
        pill.setAttribute("tabindex", "0");
        pill.onclick = function () {
          prioF = (prioF === p) ? "All" : p;
          render();
        };
        pill.onkeydown = function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            pill.click();
          }
        };

        const pKey = document.createElement("span");
        pKey.style.fontWeight = "700";
        pKey.textContent = p;

        const label = document.createElement("span");
        label.style.color = "#9ba8bc";
        label.textContent = cfg.label;

        const badge = document.createElement("span");
        badge.className = "count";
        badge.style.color = cfg.bg;
        badge.textContent = String(count);

        pill.appendChild(pKey);
        pill.appendChild(label);
        pill.appendChild(badge);
        root.appendChild(pill);
      });
    }

    function renderTags() {
      const root = document.getElementById("tag-row");
      root.innerHTML = "";
      tags.forEach(function (tag) {
        const btn = document.createElement("button");
        btn.className = "tag-btn" + (tagF === tag ? " active" : "");
        btn.textContent = tag;
        btn.onclick = function () {
          tagF = tag;
          render();
        };
        root.appendChild(btn);
      });
    }

    function priorityChip(p) {
      const cfg = pc[p];
      const el = document.createElement("span");
      el.style.background = cfg.bg + "22";
      el.style.color = cfg.bg;
      el.style.fontSize = "9px";
      el.style.fontWeight = "700";
      el.style.padding = "2px 7px";
      el.style.borderRadius = "4px";
      el.style.letterSpacing = "0.05em";
      el.textContent = p;
      return el;
    }

    function renderTasks() {
      const list = visibleTasks();
      const meta = document.getElementById("meta");
      meta.textContent = "Показано " + list.length + " из " + tasks.length;

      const root = document.getElementById("tasks");
      root.innerHTML = "";

      list.forEach(function (task) {
        const isOpen = (openTask === task.id);
        const cfg = pc[task.priority];

        const card = document.createElement("div");
        card.className = "task" + (isOpen ? " open" : "");
        card.style.borderLeftColor = cfg.bg;
        card.style.borderColor = isOpen ? (cfg.bg + "55") : "rgba(255,255,255,0.06)";
        card.onclick = function () {
          openTask = (isOpen ? null : task.id);
          renderTasks();
        };

        const head = document.createElement("div");
        head.className = "task-head";
        head.appendChild(priorityChip(task.priority));

        const id = document.createElement("span");
        id.className = "task-id";
        id.textContent = task.id;
        head.appendChild(id);

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = task.title;
        head.appendChild(title);

        const tag = document.createElement("span");
        tag.className = "task-tag";
        tag.textContent = task.tag;
        head.appendChild(tag);

        const effort = document.createElement("span");
        effort.className = "task-effort";
        effort.textContent = task.effort;
        head.appendChild(effort);

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "▾";
        head.appendChild(arrow);

        card.appendChild(head);

        const body = document.createElement("div");
        body.className = "task-body";

        const whyLabel = document.createElement("div");
        whyLabel.className = "sec-label";
        whyLabel.textContent = "Почему важно";
        body.appendChild(whyLabel);

        const why = document.createElement("div");
        why.className = "why";
        why.textContent = task.why;
        body.appendChild(why);

        const whatLabel = document.createElement("div");
        whatLabel.className = "sec-label";
        whatLabel.textContent = "Что сделать";
        body.appendChild(whatLabel);

        task.what.forEach(function (item) {
          const row = document.createElement("div");
          row.className = "what-item";

          const marker = document.createElement("span");
          marker.className = "what-arrow";
          marker.style.color = cfg.bg;
          marker.textContent = "→";

          const text = document.createElement("span");
          text.textContent = item;

          row.appendChild(marker);
          row.appendChild(text);
          body.appendChild(row);
        });

        const metaGrid = document.createElement("div");
        metaGrid.className = "meta-grid";

        const from = document.createElement("div");
        from.className = "box from";
        from.innerHTML = '<span class="label" style="color:#c9a96e">Откуда:</span>' + task.from;

        const closes = document.createElement("div");
        closes.className = "box closes";
        closes.innerHTML = '<span class="label" style="color:#4ecdc4">Закрывает:</span>' + task.closes;

        metaGrid.appendChild(from);
        metaGrid.appendChild(closes);
        body.appendChild(metaGrid);

        card.appendChild(body);
        root.appendChild(card);
      });
    }

    function render() {
      renderPriorityPills();
      renderTags();
      renderTasks();
    }

    document.addEventListener("DOMContentLoaded", render);
  </script>
</body>
</html>
