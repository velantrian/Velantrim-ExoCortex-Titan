# Velantrim Titan 9.0 — docker-compose.yml (production)
# Запуск: docker-compose up -d
# Остановка: docker-compose down
#
# Требует VELANTRIM_API_KEY в окружении/`.env` — без него контейнер не стартует.
# Для локальной разработки с dev-ключом по умолчанию используйте:
#   docker-compose -f docker-compose.dev.yml up -d
#
# GraphLab (ENABLE_GRAPH_LAB) needs the "graph-lab" build extra (networkx),
# which the default image (RUNTIME_EXTRAS=server) does not install — it
# degrades gracefully (networkx_not_installed) rather than crashing, but
# stays off by default here so the recommended compose deploy doesn't
# silently advertise a feature the default image can't serve. To use it:
#   RUNTIME_EXTRAS=server,graph-lab ENABLE_GRAPH_LAB=1 docker-compose up -d --build

services:
  velantrim:
    build:
      context: .
      args:
        RUNTIME_EXTRAS: ${RUNTIME_EXTRAS:-server}
    container_name: velantrim-titan
    ports:
      - "8000:8000"
    environment:
      - VELANTRIM_API_KEY=${VELANTRIM_API_KEY:?VELANTRIM_API_KEY is required}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-sqlite}
      # Docker intentionally uses an isolated named volume, not the host ./data folder.
      - VELANTRIM_DB_PATH=/app/data/velantrim.db
      - VELANTRIM_NGRAM_DB=/app/data/ngram.db
      - KUZU_DB_PATH=/app/data/exocortex.kuzu
      - LADYBUG_DB_PATH=/app/data/exocortex.lbug
      - LLM_PROVIDER=${LLM_PROVIDER:-none}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VELANTRIM_ASYNC_DB=1
      - VELANTRIM_LEMMATIZE_RU=1
      - ENABLE_PROMETHEUS_METRICS=1
      # Опциональные слои (выключены по умолчанию)
      - ENABLE_CONCEPT_EMERGENCE=1
      - ENABLE_WORKING_NOTEBOOK=1
      - ENABLE_CAUSAL_GRAPH=1
      - ENABLE_EVENT_BUS=1
      - ENABLE_COGNITIVE_RUNTIME=1
      - ENABLE_VELUM=1
      - ENABLE_GRAPH_LAB=${ENABLE_GRAPH_LAB:-0}
      - ENABLE_ESSENCE=1
    volumes:
      - velantrim_data:/app/data
      - ./docs:/app/docs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  velantrim_data:
    driver: local
